    <style>
        :root {
            --accent: #22d3ee;
            --bg: #0b0f14;
            --hairline: rgba( 148, 163, 184, 0.14 );
            --rail: rgba( 13, 17, 23, 0.82 );
            --text: #c6d0da;
            --text-dim: #5c6b7a;
        }
        * { box-sizing: border-box; }
        html, body {
            height: 100%;
            margin: 0;
        }
        body {
            background: var( --bg );
            color: var( --text );
            font-family: "Inter", -apple-system, sans-serif;
            font-size: 13px;
            overflow: hidden;
        }
        canvas {
            cursor: grab;
            display: block;
            height: 100%;
            left: 0;
            position: fixed;
            top: 0;
            touch-action: none;
            width: 100%;
        }
        canvas:active { cursor: grabbing; }
        aside {
            backdrop-filter: blur( 10px );
            background: var( --rail );
            border-right: 1px solid var( --hairline );
            display: flex;
            flex-direction: column;
            gap: 18px;
            height: 100%;
            left: 0;
            overflow-y: auto;
            padding: 26px 22px;
            position: fixed;
            top: 0;
            width: 248px;
            z-index: 2;
        }
        aside h1 {
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 0.32em;
            margin: 0;
        }
        aside .sub {
            color: var( --text-dim );
            font-size: 12px;
            line-height: 1.5;
            margin: -12px 0 0;
        }
        .modes {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .modes button {
            background: none;
            border: 1px solid transparent;
            border-radius: 6px;
            color: var( --text );
            cursor: pointer;
            font: inherit;
            padding: 10px 12px;
            text-align: left;
        }
        .modes button:hover { border-color: var( --hairline ); }
        .modes button[aria-pressed="true"] {
            background: rgba( 34, 211, 238, 0.07 );
            border-color: rgba( 34, 211, 238, 0.4 );
        }
        .modes b {
            display: block;
            font-size: 13px;
            font-weight: 600;
        }
        .modes span {
            color: var( --text-dim );
            display: block;
            font-size: 11px;
            line-height: 1.45;
            margin-top: 2px;
        }
        .controls {
            border-top: 1px solid var( --hairline );
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding-top: 16px;
        }
        .controls[hidden] { display: none; }
        .controls label {
            color: var( --text-dim );
            display: block;
            font-size: 11px;
            letter-spacing: 0.08em;
            margin-bottom: 5px;
            text-transform: uppercase;
        }
        .controls input[type="range"] {
            accent-color: var( --accent );
            width: 100%;
        }
        .controls .toggle {
            background: none;
            border: 1px solid var( --hairline );
            border-radius: 6px;
            color: var( --text );
            cursor: pointer;
            font: inherit;
            font-size: 12px;
            padding: 6px 10px;

        .controls .toggle[aria-pressed="true"] {
            border-color: rgba( 34, 211, 238, 0.5 );
            color: var( --accent );
        }
        .legend {
            border-top: 1px solid var( --hairline );
            padding-top: 16px;
        }
        .legend .bar {
            background: linear-gradient( 90deg, #21c0da, #f4a029, #ff4033 );
            border-radius: 2px;
            height: 6px;
            margin: 6px 0 4px;
        }
        .legend .ends {
            color: var( --text-dim );
            display: flex;
            font-size: 10px;
            justify-content: space-between;
            letter-spacing: 0.06em;
            text-transform: uppercase;

        .stats {
            border-top: 1px solid var( --hairline );
            color: var( --text-dim );
            font-size: 11px;
            line-height: 1.7;
            margin-top: auto;
            padding-top: 14px;
        }

            color: var( --accent );
            font-weight: 600;
        }
        #fallback[hidden] { display: none; }

            background: var( --bg );

            top: 0;

            padding: 22px 28px;

            background-blend-mode: multiply;

        @media ( max-width: 760px ) {

                overflow-x: auto;
                padding: 10px 12px;
                top: auto;
                width: 100%;
            }
            aside h1, aside .sub, .controls, .legend, .stats { display: none; }
            .modes { flex-direction: row; }
        }

<body>
    <canvas id="view"></canvas>
    <aside>
        <h1>VANTAGE</h1>
        <p class="sub">One synthetic telemetry feed from 40 data centers &mdash; read three ways. Drag to orbit, scroll to zoom.</p>
        <div class="modes" id="modes">
            <button data-mode="points" aria-pressed="true">
                <b>Requests</b>
                <span>250,000 request samples &mdash; time of day &times; latency &times; load. Every point is one record, drawn in a single instanced call.</span>
            </button>
            <button data-mode="flows" aria-pressed="false">
                <b>Flows</b>
                <span>Inter-site traffic arcing between 40 data centers on a globe. Pulse speed follows flow weight.</span>
            </button>
            <button data-mode="bars" aria-pressed="false">
                <b>Load</b>
                <span>Site utilization over time as a 4,096-bar terrain &mdash; daily cycles, weekend dips, incident spikes.</span>
            </button>
        </div>
        <div class="controls" id="cPoints">
            <div>
                <label for="pSize">Point size</label>
                <input id="pSize" type="range" min="0.004" max="0.028" step="0.001" value="0.011">
            </div>
            <div>
                <label for="pThresh">Highlight latency above</label>
                <input id="pThresh" type="range" min="0" max="1.3" step="0.01" value="0">
            </div>
        </div>
        <div class="controls" id="cFlows" hidden>
            <div>
                <label for="fSpeed">Pulse speed</label>
                <input id="fSpeed" type="range" min="0" max="3" step="0.05" value="1">
            </div>
        </div>
        <div class="controls" id="cBars" hidden>
            <div>
                <label for="bTime">Time window</label>
                <input id="bTime" type="range" min="0" max="12.56" step="0.02" value="0">
            </div>
            <button class="toggle" id="bAnim" aria-pressed="true">Live scroll</button>
        </div>
        <div class="legend">
            <div class="ends"><span id="legendName">latency</span></div>
            <div class="bar"></div>
            <div class="ends"><span>nominal</span><span>critical</span></div>
        </div>
        <div class="stats">
            <div>INSTANCES <b id="sCount">250,000</b></div>
            <div>FPS <b id="sFps">&mdash;</b></div>
        </div>
    </aside>
    <div id="fallback" hidden>
        <div class="notice">
            <p>This experiment needs WebGPU. Try a current Chrome, Edge, Firefox, or Safari.</p>
            <p id="fallbackDetail" style="font-size: 0.85em; opacity: 0.6;"></p>
        </div>
    </div>
    <script type="module">
        import { init, effect, draw, frame, sampler, surface, target } from "../vendor/vgpu.js?v=7";

        const CAM_WGSL_STRUCT = "struct Cam { vp: mat4x4f, eye: vec4f, right: vec4f, up: vec4f, fwd: vec4f, a: vec4f, b: vec4f }";

        const POINTS_WGSL = `
            struct Cam { vp: mat4x4f, eye: vec4f, right: vec4f, up: vec4f, fwd: vec4f, a: vec4f, b: vec4f }
            @group(0) @binding(0) var<uniform> u: Cam;

            struct Out {
                @builtin(position) position: vec4f,
                @location(0) uv: vec2f,
                @location(1) val: f32,
                @location(2) dim: f32,
            }

            fn hash( n: f32 ) -> f32 {
                return fract( sin( n ) * 43758.5453123 );
            }

            @vertex fn vs_main( @builtin(vertex_index) v: u32, @builtin(instance_index) i: u32 ) -> Out {
                var corners = array<vec2f, 6>(
                    vec2f( -1.0, -1.0 ), vec2f( 1.0, -1.0 ), vec2f( 1.0, 1.0 ),
                    vec2f( -1.0, -1.0 ), vec2f( 1.0, 1.0 ), vec2f( -1.0, 1.0 ),
                );
                let fi = f32( i );
                let h1 = hash( fi * 0.7310 + 1.3 );
                let h2 = hash( fi * 1.2930 + 7.7 );
                let h3 = hash( fi * 2.1170 + 3.1 );
                let h4 = hash( fi * 3.7190 + 9.2 );
                let t = h1;
                let dayload = 0.45 + 0.28 * sin( t * 6.28318 - 1.9 ) + 0.12 * sin( t * 12.566 + 1.0 );
                let load = clamp( dayload + ( h2 - 0.5 ) * 0.3, 0.02, 1.0 );
                let base = 0.06 + load * load * 0.5;
                let tail = select( 0.0, h4 * 0.9, h3 > 0.992 );
                let lat = clamp( base + ( hash( fi * 4.377 ) - 0.5 ) * 0.08 + tail, 0.0, 1.4 );

                var world = vec3f( ( t - 0.5 ) * 2.4, lat * 1.3 - 0.7, ( h2 - 0.5 ) * 2.0 );
                let corner = corners[ v ];
                world += ( u.right.xyz * corner.x + u.up.xyz * corner.y ) * u.a.z;

                var out: Out;
                out.position = u.vp * vec4f( world, 1.0 );
                out.uv = corner;
                out.val = lat / 1.4;
                out.dim = select( 1.0, 0.08, u.a.w > 0.01 && lat < u.a.w );
                return out;
            }

            @fragment fn fs_main( @location(0) uv: vec2f, @location(1) val: f32, @location(2) dim: f32 ) -> @location(0) vec4f {
                let d = length( uv );
                let alpha = smoothstep( 1.0, 0.3, d ) * 0.06 * dim;
                var col = mix( vec3f( 0.13, 0.75, 0.85 ), vec3f( 0.96, 0.63, 0.16 ), smoothstep( 0.12, 0.7, val ) );
                col = mix( col, vec3f( 1.0, 0.25, 0.2 ), smoothstep( 0.8, 1.05, val ) );
                return vec4f( col * alpha, 1.0 );
            }
        `;

        const PGRID_WGSL = `
            struct Cam { vp: mat4x4f, eye: vec4f, right: vec4f, up: vec4f, fwd: vec4f, a: vec4f, b: vec4f }
            @group(0) @binding(0) var<uniform> u: Cam;

            fn line1d( x: f32, spacing: f32, width: f32 ) -> f32 {
                let g = abs( fract( x / spacing + 0.5 ) - 0.5 ) * spacing;
                return smoothstep( width, 0.0, g );
            }

            @fragment fn fs_main( @location(0) uvIn: vec2f ) -> @location(0) vec4f {
                var p = uvIn * 2.0 - 1.0;
                p.y = -p.y;
                let dir = normalize( u.fwd.xyz * 1.5 + u.right.xyz * p.x * u.a.x + u.up.xyz * p.y );
                var col = mix( vec3f( 0.043, 0.059, 0.078 ), vec3f( 0.051, 0.075, 0.106 ), uvIn.y );
                if ( dir.y < -0.001 ) {
                    let t = ( -0.72 - u.eye.y ) / dir.y;
                    if ( t > 0.0 ) {
                        let hit = u.eye.xyz + dir * t;
                        let fade = exp( -length( hit.xz - u.eye.xz ) * 0.30 ) * exp( -max( t - 2.0, 0.0 ) * 0.2 );
                        var g = max( line1d( hit.x, 0.3, 0.006 ), line1d( hit.z, 0.3, 0.006 ) ) * 0.20;
                        g = max( g, max( line1d( hit.x, 1.2, 0.012 ), line1d( hit.z, 1.2, 0.012 ) ) * 0.38 );
                        col += vec3f( 0.13, 0.55, 0.65 ) * g * fade;
                    }
                }
                return vec4f( col, 1.0 );
            }
        `;

        const GLOBE_WGSL = `
            struct Cam { vp: mat4x4f, eye: vec4f, right: vec4f, up: vec4f, fwd: vec4f, a: vec4f, b: vec4f }
            @group(0) @binding(0) var<uniform> u: Cam;

            fn hash2( p: vec2f ) -> f32 {
                return fract( sin( dot( p, vec2f( 127.1, 311.7 ) ) ) * 43758.5453123 );
            }

            fn gridline( x: f32, spacing: f32, width: f32 ) -> f32 {
                let g = abs( fract( x / spacing + 0.5 ) - 0.5 ) * spacing;
                return smoothstep( width, 0.0, g );
            }

            @fragment fn fs_main( @location(0) uvIn: vec2f ) -> @location(0) vec4f {
                var p = uvIn * 2.0 - 1.0;
                p.y = -p.y;
                let ro = u.eye.xyz;
                let rd = normalize( u.fwd.xyz * 1.5 + u.right.xyz * p.x * u.a.x + u.up.xyz * p.y );

                var col = vec3f( 0.024, 0.033, 0.047 ) * ( 1.0 - 0.4 * length( p ) * 0.5 );
                let cell = floor( ( p * vec2f( u.a.x, 1.0 ) ) * 60.0 );
                let star = step( 0.995, hash2( cell ) );
                col += vec3f( 0.5, 0.7, 0.8 ) * star * 0.25;

                let b = dot( ro, rd );
                let c = dot( ro, ro ) - 1.0;
                let disc = b * b - c;
                if ( disc > 0.0 ) {
                    let t = -b - sqrt( disc );
                    if ( t > 0.0 ) {
                        let n = normalize( ro + rd * t );
                        let light = max( dot( n, normalize( vec3f( 0.55, 0.45, 0.55 ) ) ), 0.0 );
                        var g = mix( vec3f( 0.031, 0.055, 0.082 ), vec3f( 0.058, 0.114, 0.161 ), light );
                        let latDeg = degrees( asin( clamp( n.y, -1.0, 1.0 ) ) );
                        let lonDeg = degrees( atan2( n.z, n.x ) );
                        let squish = max( cos( radians( latDeg ) ), 0.15 );
                        var lines = max( gridline( latDeg, 15.0, 0.35 ), gridline( lonDeg, 15.0, 0.35 / squish ) );
                        g += vec3f( 0.13, 0.42, 0.5 ) * lines * 0.16;
                        g += vec3f( 0.13, 0.42, 0.5 ) * gridline( latDeg, 90.0, 0.5 ) * 0.2;
                        let fresnel = pow( clamp( 1.0 + dot( rd, n ), 0.0, 1.0 ), 2.5 );
                        g += vec3f( 0.13, 0.62, 0.73 ) * fresnel * 0.4;
                        col = g;
                    }
                }
                return vec4f( col, 1.0 );
            }
        `;

        const ARCS_WGSL = `
            struct Cam { vp: mat4x4f, eye: vec4f, right: vec4f, up: vec4f, fwd: vec4f, a: vec4f, b: vec4f }
            @group(0) @binding(0) var<uniform> u: Cam;

            const SITES = array<vec3f, 40>(
                vec3f( 0.1751, 0.6280, 0.7583 ),
                vec3f( 0.1682, 0.6293, 0.7587 ),
                vec3f( -0.4198, 0.6074, 0.6744 ),
                vec3f( -0.3624, 0.7145, 0.5985 ),
                vec3f( 0.0312, 0.6678, 0.7437 ),
                vec3f( -0.0995, 0.5417, 0.8347 ),
                vec3f( 0.0812, 0.5548, 0.8280 ),
                vec3f( 0.2090, 0.6521, 0.7288 ),
                vec3f( -0.3603, 0.7385, 0.5700 ),
                vec3f( -0.3918, 0.5592, 0.7306 ),
                vec3f( 0.1532, 0.4352, 0.8872 ),
                vec3f( 0.1330, 0.6909, 0.7106 ),
                vec3f( -0.1492, 0.3322, 0.9314 ),
                vec3f( 0.6301, -0.3987, 0.6663 ),
                vec3f( 0.4313, -0.5678, 0.7011 ),
                vec3f( 0.6225, 0.7826, 0.0011 ),
                vec3f( 0.6341, 0.7672, -0.0970 ),
                vec3f( 0.6093, 0.7912, -0.0522 ),
                vec3f( 0.6568, 0.7536, -0.0275 ),
                vec3f( 0.5941, 0.8018, 0.0645 ),
                vec3f( 0.4853, 0.8599, -0.1586 ),
                vec3f( 0.6694, 0.7361, -0.1000 ),
                vec3f( 0.7600, 0.6481, 0.0491 ),
                vec3f( 0.6919, 0.7133, -0.1121 ),
                vec3f( 0.5922, 0.7934, -0.1411 ),
                vec3f( 0.4453, 0.8271, -0.3430 ),
                vec3f( 0.5700, 0.4399, -0.6939 ),
                vec3f( 0.5151, 0.4258, -0.7439 ),
                vec3f( -0.2385, 0.0236, -0.9709 ),
                vec3f( -0.3793, 0.3795, -0.8439 ),
                vec3f( -0.6194, 0.5835, -0.5252 ),
                vec3f( -0.5864, 0.5693, -0.5762 ),
                vec3f( -0.4757, 0.6101, -0.6336 ),
                vec3f( -0.4469, 0.5180, -0.7293 ),
                vec3f( -0.3411, 0.6414, -0.6872 ),
                vec3f( 0.2779, 0.3272, -0.9032 ),
                vec3f( 0.1945, 0.4787, -0.8562 ),
                vec3f( -0.7273, -0.5577, -0.3999 ),
                vec3f( -0.6473, -0.6129, -0.4532 ),
                vec3f( 0.7922, -0.4415, -0.4212 )
            );
            const SEGS = 60u;

            struct Out {
                @builtin(position) position: vec4f,
                @location(0) side: f32,
                @location(1) t: f32,
                @location(2) w: f32,
                @location(3) vis: f32,
            }

            fn hash( n: f32 ) -> f32 {
                return fract( sin( n ) * 43758.5453123 );
            }

            fn occlusion( eye: vec3f, p: vec3f ) -> f32 {
                let toP = p - eye;
                let len = length( toP );
                let rd = toP / len;
                let b = dot( eye, rd );
                let cc = dot( eye, eye ) - 1.0;
                let disc = b * b - cc;
                if ( disc > 0.0 ) {
                    let th = -b - sqrt( disc );
                    if ( th > 0.0 && th < len - 0.02 ) { return 0.0; }
                }
                return 1.0;
            }

            fn arcPoint( a: vec3f, b: vec3f, t: f32 ) -> vec3f {
                let ang = acos( clamp( dot( a, b ), -1.0, 1.0 ) );
                let s = max( sin( ang ), 1e-4 );
                let pos = ( a * sin( ( 1.0 - t ) * ang ) + b * sin( t * ang ) ) / s;
                let alt = 1.004 + sin( 3.14159 * t ) * ( 0.1 + 0.5 * ang / 3.14159 );
                return normalize( pos ) * alt;
            }

            @vertex fn vs_main( @builtin(vertex_index) v: u32, @builtin(instance_index) i: u32 ) -> Out {
                let arc = i / SEGS;
                let seg = i % SEGS;
                let fa = f32( arc );
                var src = u32( hash( fa * 3.11 + 0.7 ) * 40.0 ) % 40u;
                var dst = u32( hash( fa * 7.77 + 2.3 ) * 40.0 ) % 40u;
                if ( src == dst ) { dst = ( dst + 7u ) % 40u; }
                let w = hash( fa * 5.13 + 4.9 );
                let sA = SITES[ src ];
                let sB = SITES[ dst ];
                let angAB = acos( clamp( dot( sA, sB ), -1.0, 1.0 ) );
                let alive = select( 0.0, 1.0, angAB > 0.06 && angAB < 2.5 );

                let t0 = f32( seg ) / f32( SEGS );
                let t1 = f32( seg + 1u ) / f32( SEGS );
                let pickEnd = v == 1u || v == 2u || v == 4u;
                let tSel = select( t0, t1, pickEnd );
                let side = select( -1.0, 1.0, v == 2u || v == 4u || v == 5u );

                let p0 = arcPoint( sA, sB, t0 );
                let p1 = arcPoint( sA, sB, t1 );
                let sel = select( p0, p1, pickEnd );

                let tangent = normalize( p1 - p0 + vec3f( 1e-5, 0.0, 0.0 ) );
                let viewDir = normalize( sel - u.eye.xyz );
                let perp = normalize( cross( tangent, viewDir ) );
                let world = sel + perp * side * u.b.y;
                let clip = u.vp * vec4f( world, 1.0 );

                var out: Out;
                out.position = clip;
                out.side = side;
                out.t = tSel;
                out.w = w;
                out.vis = alive * occlusion( u.eye.xyz, world );
                return out;
            }

            @fragment fn fs_main( @location(0) side: f32, @location(1) t: f32, @location(2) w: f32, @location(3) vis: f32 ) -> @location(0) vec4f {
                let edge = 1.0 - abs( side );
                let taper = pow( sin( 3.14159 * t ), 0.5 );
                let ph = fract( t - u.a.y * u.b.x * ( 0.25 + w * 0.6 ) - w * 7.0 );
                let head = smoothstep( 0.18, 0.0, ph ) * 1.4;
                let alpha = ( 0.10 + head ) * edge * taper * vis;
                let col = mix( vec3f( 0.13, 0.75, 0.85 ), vec3f( 0.96, 0.63, 0.16 ), w );
                return vec4f( col * alpha, 1.0 );
            }
        `;

        const DOTS_WGSL = `
            struct Cam { vp: mat4x4f, eye: vec4f, right: vec4f, up: vec4f, fwd: vec4f, a: vec4f, b: vec4f }
            @group(0) @binding(0) var<uniform> u: Cam;

            const SITES = array<vec3f, 40>(
                vec3f( 0.1751, 0.6280, 0.7583 ),
                vec3f( 0.1682, 0.6293, 0.7587 ),
                vec3f( -0.4198, 0.6074, 0.6744 ),
                vec3f( -0.3624, 0.7145, 0.5985 ),
                vec3f( 0.0312, 0.6678, 0.7437 ),
                vec3f( -0.0995, 0.5417, 0.8347 ),
                vec3f( 0.0812, 0.5548, 0.8280 ),
                vec3f( 0.2090, 0.6521, 0.7288 ),
                vec3f( -0.3603, 0.7385, 0.5700 ),
                vec3f( -0.3918, 0.5592, 0.7306 ),
                vec3f( 0.1532, 0.4352, 0.8872 ),
                vec3f( 0.1330, 0.6909, 0.7106 ),
                vec3f( -0.1492, 0.3322, 0.9314 ),
                vec3f( 0.6301, -0.3987, 0.6663 ),
                vec3f( 0.4313, -0.5678, 0.7011 ),
                vec3f( 0.6225, 0.7826, 0.0011 ),
                vec3f( 0.6341, 0.7672, -0.0970 ),
                vec3f( 0.6093, 0.7912, -0.0522 ),
                vec3f( 0.6568, 0.7536, -0.0275 ),
                vec3f( 0.5941, 0.8018, 0.0645 ),
                vec3f( 0.4853, 0.8599, -0.1586 ),
                vec3f( 0.6694, 0.7361, -0.1000 ),
                vec3f( 0.7600, 0.6481, 0.0491 ),
                vec3f( 0.6919, 0.7133, -0.1121 ),
                vec3f( 0.5922, 0.7934, -0.1411 ),
                vec3f( 0.4453, 0.8271, -0.3430 ),
                vec3f( 0.5700, 0.4399, -0.6939 ),
                vec3f( 0.5151, 0.4258, -0.7439 ),
                vec3f( -0.2385, 0.0236, -0.9709 ),
                vec3f( -0.3793, 0.3795, -0.8439 ),
                vec3f( -0.6194, 0.5835, -0.5252 ),
                vec3f( -0.5864, 0.5693, -0.5762 ),
                vec3f( -0.4757, 0.6101, -0.6336 ),
                vec3f( -0.4469, 0.5180, -0.7293 ),
                vec3f( -0.3411, 0.6414, -0.6872 ),
                vec3f( 0.2779, 0.3272, -0.9032 ),
                vec3f( 0.1945, 0.4787, -0.8562 ),
                vec3f( -0.7273, -0.5577, -0.3999 ),
                vec3f( -0.6473, -0.6129, -0.4532 ),
                vec3f( 0.7922, -0.4415, -0.4212 )
            );

            struct Out {
                @builtin(position) position: vec4f,
                @location(0) uv: vec2f,
                @location(1) vis: f32,
                @location(2) pulse: f32,
            }

            fn hash( n: f32 ) -> f32 {
                return fract( sin( n ) * 43758.5453123 );
            }

            fn occlusion( eye: vec3f, p: vec3f ) -> f32 {
                let toP = p - eye;
                let len = length( toP );
                let rd = toP / len;
                let b = dot( eye, rd );
                let cc = dot( eye, eye ) - 1.0;
                let disc = b * b - cc;
                if ( disc > 0.0 ) {
                    let th = -b - sqrt( disc );
                    if ( th > 0.0 && th < len - 0.02 ) { return 0.0; }
                }
                return 1.0;
            }

            @vertex fn vs_main( @builtin(vertex_index) v: u32, @builtin(instance_index) i: u32 ) -> Out {
                var corners = array<vec2f, 6>(
                    vec2f( -1.0, -1.0 ), vec2f( 1.0, -1.0 ), vec2f( 1.0, 1.0 ),
                    vec2f( -1.0, -1.0 ), vec2f( 1.0, 1.0 ), vec2f( -1.0, 1.0 ),
                );
                let corner = corners[ v ];
                var world = SITES[ i ] * 1.006;
                let pulse = 0.6 + 0.4 * sin( u.a.y * 2.0 + hash( f32( i ) * 3.3 ) * 6.28 );
                world += ( u.right.xyz * corner.x + u.up.xyz * corner.y ) * 0.018 * ( 0.8 + pulse * 0.4 );

                var out: Out;
                out.position = u.vp * vec4f( world, 1.0 );
                out.uv = corner;
                out.vis = occlusion( u.eye.xyz, SITES[ i ] * 1.006 );
                out.pulse = pulse;
                return out;
            }

            @fragment fn fs_main( @location(0) uv: vec2f, @location(1) vis: f32, @location(2) pulse: f32 ) -> @location(0) vec4f {
                let d = length( uv );
                let core = smoothstep( 0.5, 0.1, d );
                let halo = smoothstep( 1.0, 0.4, d ) * 0.35;
                return vec4f( vec3f( 0.55, 0.9, 1.0 ) * ( core + halo ) * pulse * vis, 1.0 );
            }
        `;

        const BARS_WGSL = `
            struct Cam { vp: mat4x4f, eye: vec4f, right: vec4f, up: vec4f, fwd: vec4f, a: vec4f, b: vec4f }
            @group(0) @binding(0) var<uniform> u: Cam;

            const BOX_POS = array<vec3f, 30>(
                vec3f( -0.5, 0.0, 0.5 ),
                vec3f( 0.5, 0.0, 0.5 ),
                vec3f( 0.5, 1.0, 0.5 ),
                vec3f( -0.5, 0.0, 0.5 ),
                vec3f( 0.5, 1.0, 0.5 ),
                vec3f( -0.5, 1.0, 0.5 ),
                vec3f( 0.5, 0.0, -0.5 ),
                vec3f( -0.5, 0.0, -0.5 ),
                vec3f( -0.5, 1.0, -0.5 ),
                vec3f( 0.5, 0.0, -0.5 ),
                vec3f( -0.5, 1.0, -0.5 ),
                vec3f( 0.5, 1.0, -0.5 ),
                vec3f( 0.5, 0.0, 0.5 ),
                vec3f( 0.5, 0.0, -0.5 ),
                vec3f( 0.5, 1.0, -0.5 ),
                vec3f( 0.5, 0.0, 0.5 ),
                vec3f( 0.5, 1.0, -0.5 ),
                vec3f( 0.5, 1.0, 0.5 ),
                vec3f( -0.5, 0.0, -0.5 ),
                vec3f( -0.5, 0.0, 0.5 ),
                vec3f( -0.5, 1.0, 0.5 ),
                vec3f( -0.5, 0.0, -0.5 ),
                vec3f( -0.5, 1.0, 0.5 ),
                vec3f( -0.5, 1.0, -0.5 ),
                vec3f( -0.5, 1.0, 0.5 ),
                vec3f( 0.5, 1.0, 0.5 ),
                vec3f( 0.5, 1.0, -0.5 ),
                vec3f( -0.5, 1.0, 0.5 ),
                vec3f( 0.5, 1.0, -0.5 ),
                vec3f( -0.5, 1.0, -0.5 )
            );
            const BOX_NRM = array<vec3f, 30>(
                vec3f( 0.0, 0.0, 1.0 ),
                vec3f( 0.0, 0.0, 1.0 ),
                vec3f( 0.0, 0.0, 1.0 ),
                vec3f( 0.0, 0.0, 1.0 ),
                vec3f( 0.0, 0.0, 1.0 ),
                vec3f( 0.0, 0.0, 1.0 ),
                vec3f( 0.0, 0.0, -1.0 ),
                vec3f( 0.0, 0.0, -1.0 ),
                vec3f( 0.0, 0.0, -1.0 ),
                vec3f( 0.0, 0.0, -1.0 ),
                vec3f( 0.0, 0.0, -1.0 ),
                vec3f( 0.0, 0.0, -1.0 ),
                vec3f( 1.0, 0.0, 0.0 ),
                vec3f( 1.0, 0.0, 0.0 ),
                vec3f( 1.0, 0.0, 0.0 ),
                vec3f( 1.0, 0.0, 0.0 ),
                vec3f( 1.0, 0.0, 0.0 ),
                vec3f( 1.0, 0.0, 0.0 ),
                vec3f( -1.0, 0.0, 0.0 ),
                vec3f( -1.0, 0.0, 0.0 ),
                vec3f( -1.0, 0.0, 0.0 ),
                vec3f( -1.0, 0.0, 0.0 ),
                vec3f( -1.0, 0.0, 0.0 ),
                vec3f( -1.0, 0.0, 0.0 ),
                vec3f( 0.0, 1.0, 0.0 ),
                vec3f( 0.0, 1.0, 0.0 ),
                vec3f( 0.0, 1.0, 0.0 ),
                vec3f( 0.0, 1.0, 0.0 ),
                vec3f( 0.0, 1.0, 0.0 ),
                vec3f( 0.0, 1.0, 0.0 )
            );

            struct Out {
                @builtin(position) position: vec4f,
                @location(0) normal: vec3f,
                @location(1) h: f32,
                @location(2) ao: f32,
            }

            fn hash( n: f32 ) -> f32 {
                return fract( sin( n ) * 43758.5453123 );
            }

            @vertex fn vs_main( @builtin(vertex_index) v: u32, @builtin(instance_index) i: u32 ) -> Out {
                let x = f32( i % 64u );
                let z = f32( i / 64u );
                let base = 0.25 + 0.35 * hash( z * 3.7 + 0.61 );
                let daily = 0.22 * sin( ( x / 64.0 ) * 12.566 + hash( z * 9.1 ) * 6.28 + u.b.x );
                let week = select( 0.0, -0.13, ( u32( x / 9.14 ) % 7u ) >= 5u );
                let spike = select( 0.0, 0.55 * hash( x * 13.1 + z * 7.9 ), hash( x * 1.1 + z * 17.3 + floor( u.b.x * 0.5 ) ) > 0.994 );
                let h = clamp( base + daily + week + spike, 0.05, 1.0 );

                let cell = 2.0 / 64.0;
                let p = BOX_POS[ v ];
                var world = vec3f( ( x - 31.5 ) * cell, 0.0, ( z - 31.5 ) * cell );
                world += vec3f( p.x * cell * 0.72, p.y * h * 0.85, p.z * cell * 0.72 );
                world.y -= 0.42;

                var out: Out;
                out.position = u.vp * vec4f( world, 1.0 );
                out.normal = BOX_NRM[ v ];
                out.h = h;
                out.ao = mix( 0.45, 1.0, p.y );
                return out;
            }

            @fragment fn fs_main( @location(0) normal: vec3f, @location(1) h: f32, @location(2) ao: f32 ) -> @location(0) vec4f {
                let light = max( dot( normalize( normal ), normalize( vec3f( 0.5, 0.8, 0.35 ) ) ), 0.0 );
                var col = mix( vec3f( 0.13, 0.75, 0.85 ), vec3f( 0.96, 0.63, 0.16 ), smoothstep( 0.25, 0.75, h ) );
                col = mix( col, vec3f( 1.0, 0.25, 0.2 ), smoothstep( 0.78, 1.0, h ) );
                col *= ( 0.25 + 0.75 * light ) * ao;
                return vec4f( col, 1.0 );
            }
        `;

        const BLIT_WGSL = `
            @group(0) @binding(0) var src: texture_2d<f32>;
            @group(0) @binding(1) var samp: sampler;

            fn hash2( p: vec2f ) -> f32 {
                return fract( sin( dot( p, vec2f( 127.1, 311.7 ) ) ) * 43758.5453123 );
            }

            @fragment fn fs_main( @location(0) uv: vec2f, @builtin(position) fragPos: vec4f ) -> @location(0) vec4f {
                var col = textureSampleLevel( src, samp, uv, 0.0 ).rgb;
                col += ( hash2( fragPos.xy ) - 0.5 ) * 0.01;
                let vig = 1.0 - 0.24 * pow( distance( uv, vec2f( 0.5 ) ) * 1.3, 2.2 );
                return vec4f( col * vig, 1.0 );
            }
        `;

        const BUILD = "Vantage build 1 (2026-08-28)";
        console.log( BUILD );
        let booted = false;
        window.addEventListener( "error", ( e ) => {
            if ( !booted ) { showFallback( "Uncaught: " + e.message + " [" + BUILD + "]" ); }
        } );
        window.addEventListener( "unhandledrejection", ( e ) => {
            if ( !booted ) { showFallback( "Unhandled rejection: " + ( e.reason && e.reason.message || e.reason ) + " [" + BUILD + "]" ); }
        } );

        function perspective( fovY, aspect, near, far ) {
            const f = 1 / Math.tan( fovY / 2 );
            const nf = 1 / ( near - far );
            return [
                f / aspect, 0, 0, 0,
                0, f, 0, 0,
                0, 0, ( far + near ) * nf, -1,
                0, 0, 2 * far * near * nf, 0,
            ];
        }

        function lookAt( eye, center, up ) {
            const z = norm3( sub3( eye, center ) );
            const x = norm3( cross3( up, z ) );
            const y = cross3( z, x );
            return [
                x[ 0 ], y[ 0 ], z[ 0 ], 0,
                x[ 1 ], y[ 1 ], z[ 1 ], 0,
                x[ 2 ], y[ 2 ], z[ 2 ], 0,
                -dot3( x, eye ), -dot3( y, eye ), -dot3( z, eye ), 1,
            ];
        }

        function mul4( a, b ) {
            const out = new Array( 16 ).fill( 0 );
            for ( let col = 0; col < 4; col++ ) {
                for ( let row = 0; row < 4; row++ ) {
                    let s = 0;
                    for ( let k = 0; k < 4; k++ ) { s += a[ k * 4 + row ] * b[ col * 4 + k ]; }
                    out[ col * 4 + row ] = s;
                }
            }
            return out;
        }

        function sub3( a, b ) { return [ a[ 0 ] - b[ 0 ], a[ 1 ] - b[ 1 ], a[ 2 ] - b[ 2 ] ]; }
        function cross3( a, b ) {
            return [
                a[ 1 ] * b[ 2 ] - a[ 2 ] * b[ 1 ],
                a[ 2 ] * b[ 0 ] - a[ 0 ] * b[ 2 ],
                a[ 0 ] * b[ 1 ] - a[ 1 ] * b[ 0 ],
            ];
        }
        function dot3( a, b ) { return a[ 0 ] * b[ 0 ] + a[ 1 ] * b[ 1 ] + a[ 2 ] * b[ 2 ]; }
        function norm3( a ) {
            const l = Math.hypot( a[ 0 ], a[ 1 ], a[ 2 ] ) || 1;
            return [ a[ 0 ] / l, a[ 1 ] / l, a[ 2 ] / l ];
        }

        function clamp( v, lo, hi ) {
            return Math.min( hi, Math.max( lo, v ) );
        }

        function el( id ) {
            return document.getElementById( id );
        }

        const pointer = { down: false, lx: 0, ly: 0 };
        let activeName = "points";

        async function main() {
            if ( !navigator.gpu ) {
                showFallback( "navigator.gpu is undefined — WebGPU is not enabled in this browser." );
                return;
            }
            let gpu;
            try {
                gpu = await init();
                gpu.onError( ( err ) => {
                    if ( /lost|destroy/i.test( String( err ) ) ) {
                        showFallback( "The GPU device was lost — the renderer may be overloaded on this hardware. " + err );
                    }
                } );
            } catch ( err ) {
                showFallback( String( err ).indexOf( "null" ) !== -1
                    ? "This browser exposes WebGPU but returned no adapter — the OS or GPU is likely blocklisted. Showing the static preview."
                    : "WebGPU init failed: " + ( err && err.message ? err.message : err ) );
                return;
            }

            const canvas = el( "view" );
            const canvasSurface = surface( gpu, canvas, { dpr: [ 1, 2 ] } );
            const linear = sampler( gpu, { magFilter: "linear", minFilter: "linear" } );

            const pgrid = effect( gpu, PGRID_WGSL );
            const points = draw( gpu, { blend: "additive", depth: false, instances: 250000, shader: POINTS_WGSL, vertices: 6 } );
            const globe = effect( gpu, GLOBE_WGSL );
            const arcs = draw( gpu, { blend: "additive", depth: false, instances: 48 * 60, shader: ARCS_WGSL, vertices: 6 } );
            const dots = draw( gpu, { blend: "additive", depth: false, instances: 40, shader: DOTS_WGSL, vertices: 6 } );
            const bars = draw( gpu, { cull: "back", instances: 4096, shader: BARS_WGSL, vertices: 30 } );
            const blit = effect( gpu, BLIT_WGSL );

            let sceneT = null;
            function rebuild() {
                const size = [ canvasSurface.size[ 0 ], canvasSurface.size[ 1 ] ];
                if ( sceneT ) { sceneT.resize( size ); } else { sceneT = target( gpu, { depth: true, size: size } ); }
            }
            rebuild();
            canvasSurface.onResize( rebuild );

            const cams = {
                bars: { dist: 3.0, phi: 0.62, theta: 0.9, velT: 0.0015 },
                flows: { dist: 2.7, phi: 0.35, theta: 0.4, velT: 0.0022 },
                points: { dist: 3.4, phi: 0.42, theta: 0.7, velT: 0.0015 },
            };
            const ui = {
                bAnim: true, bTime: 0, fSpeed: 1, pSize: 0.011, pThresh: 0,
            };

            canvas.addEventListener( "pointerdown", ( e ) => {
                pointer.down = true;
                pointer.lx = e.clientX;
                pointer.ly = e.clientY;
            } );
            window.addEventListener( "pointerup", () => { pointer.down = false; } );
            window.addEventListener( "pointermove", ( e ) => {
                if ( !pointer.down ) { return; }
                const cam = cams[ activeName ];
                cam.theta += ( e.clientX - pointer.lx ) * 0.005;
                cam.phi = clamp( cam.phi + ( e.clientY - pointer.ly ) * 0.005, -1.35, 1.35 );
                pointer.lx = e.clientX;
                pointer.ly = e.clientY;
            } );
            canvas.addEventListener( "wheel", ( e ) => {
                e.preventDefault();
                const cam = cams[ activeName ];
                cam.dist = clamp( cam.dist * Math.exp( e.deltaY * 0.001 ), 1.6, 7 );
            }, { passive: false } );

            const counts = { bars: "4,096 bars", flows: "2,880 segments", points: "250,000" };
            const legends = { bars: "utilization", flows: "flow weight", points: "latency" };
            document.querySelectorAll( "#modes button" ).forEach( ( b ) => {
                b.addEventListener( "click", () => {
                    activeName = b.dataset.mode;
                    document.querySelectorAll( "#modes button" ).forEach( ( x ) => {
                        x.setAttribute( "aria-pressed", x.dataset.mode === activeName ? "true" : "false" );
                    } );
                    el( "cPoints" ).hidden = activeName !== "points";
                    el( "cFlows" ).hidden = activeName !== "flows";
                    el( "cBars" ).hidden = activeName !== "bars";
                    el( "sCount" ).textContent = counts[ activeName ];
                    el( "legendName" ).textContent = legends[ activeName ];
                } );
            } );
            el( "pSize" ).addEventListener( "input", ( e ) => { ui.pSize = parseFloat( e.target.value ); } );
            el( "pThresh" ).addEventListener( "input", ( e ) => { ui.pThresh = parseFloat( e.target.value ); } );
            el( "fSpeed" ).addEventListener( "input", ( e ) => { ui.fSpeed = parseFloat( e.target.value ); } );
            el( "bTime" ).addEventListener( "input", ( e ) => {
                ui.bTime = parseFloat( e.target.value );
                ui.bAnim = false;
                el( "bAnim" ).setAttribute( "aria-pressed", "false" );
            } );
            el( "bAnim" ).addEventListener( "click", () => {
                ui.bAnim = !ui.bAnim;
                el( "bAnim" ).setAttribute( "aria-pressed", ui.bAnim ? "true" : "false" );
            } );

            function uniformsFor( a, b ) {
                const cam = cams[ activeName ];
                const eye = [
                    cam.dist * Math.cos( cam.phi ) * Math.cos( cam.theta ),
                    cam.dist * Math.sin( cam.phi ),
                    cam.dist * Math.cos( cam.phi ) * Math.sin( cam.theta ),
                ];
                const aspect = canvasSurface.size[ 0 ] / canvasSurface.size[ 1 ];
                const view = lookAt( eye, [ 0, 0, 0 ], [ 0, 1, 0 ] );
                const proj = perspective( 0.9, aspect, 0.05, 40 );
                const fwd = norm3( sub3( [ 0, 0, 0 ], eye ) );
                const right = norm3( cross3( fwd, [ 0, 1, 0 ] ) );
                const up = cross3( right, fwd );
                return {
                    a: [ aspect, a[ 0 ], a[ 1 ], a[ 2 ] ],
                    b: b,
                    eye: [ eye[ 0 ], eye[ 1 ], eye[ 2 ], 0 ],
                    fwd: [ fwd[ 0 ], fwd[ 1 ], fwd[ 2 ], 0 ],
                    right: [ right[ 0 ], right[ 1 ], right[ 2 ], 0 ],
                    up: [ up[ 0 ], up[ 1 ], up[ 2 ], 0 ],
                    vp: new Float32Array( mul4( proj, view ) ),
                };
            }

            let time = 0;
            let lastNow = performance.now();
            let fpsAccum = 0;
            let fpsCount = 0;

            function tick( now ) {
                const dt = Math.min( ( now - lastNow ) / 1000, 0.1 );
                lastNow = now;
                time += dt;
                fpsAccum += 1 / Math.max( dt, 0.001 );
                fpsCount++;
                if ( fpsCount === 30 ) {
                    el( "sFps" ).textContent = Math.round( fpsAccum / 30 );
                    fpsAccum = 0;
                    fpsCount = 0;
                }

                const cam = cams[ activeName ];
                if ( !pointer.down ) { cam.theta += cam.velT; }

                if ( activeName === "points" ) {
                    const u = uniformsFor( [ time, ui.pSize, ui.pThresh ], [ 0, 0, 0, 0 ] );
                    pgrid.set( { u: u } );
                    points.set( { u: u } );
                    frame( gpu, ( f ) => f.pass( { target: canvasSurface }, ( p ) => {
                        p.draw( pgrid );
                        p.draw( points );
                    } ) );
                } else if ( activeName === "flows" ) {
                    const u = uniformsFor( [ time, 0, 0 ], [ ui.fSpeed, 0.007, 0, 0 ] );
                    globe.set( { u: u } );
                    arcs.set( { u: u } );
                    dots.set( { u: u } );
                    frame( gpu, ( f ) => f.pass( { target: canvasSurface }, ( p ) => {
                        p.draw( globe );
                        p.draw( arcs );
                        p.draw( dots );
                    } ) );
                } else {
                    if ( ui.bAnim ) {
                        ui.bTime = ( ui.bTime + dt * 0.35 ) % 12.56;
                        el( "bTime" ).value = ui.bTime;
                    }
                    const u = uniformsFor( [ time, 0, 0 ], [ ui.bTime, 0, 0, 0 ] );
                    bars.set( { u: u } );
                    blit.set( { samp: linear, src: sceneT } );
                    frame( gpu, ( f ) => {
                        f.pass( { clear: [ 0.043, 0.059, 0.078, 1 ], target: sceneT }, ( p ) => p.draw( bars ) );
                        f.pass( canvasSurface, blit );
                    } );
                }
                booted = true;
                requestAnimationFrame( tick );
            }
            requestAnimationFrame( tick );
        }

        function showFallback( detail ) {
            const fb = document.getElementById( "fallback" );
            fb.hidden = false;
            fb.classList.add( "preview" );
            document.getElementById( "fallbackDetail" ).textContent = detail || "";
        }

        main();
    </script>
</body>
</html>
