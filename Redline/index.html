<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Redline</title>
    <meta name="description" content="Drop in a video, get a word-timed transcript on your own device, strike the words you don't want, and export a cut with those parts gone. Nothing leaves the browser.">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="experiments by Kevin">
    <meta property="og:title" content="Redline">
    <meta property="og:description" content="Edit video by striking words out of its transcript. Whisper runs on-device via WebGPU, words follow playback, and the export re-cuts the file with WebCodecs. Nothing is uploaded.">
    <meta property="og:url" content="https://kevin-freitas-wwt.github.io/experiments/Redline/">
    <meta property="og:image" content="https://kevin-freitas-wwt.github.io/experiments/Redline/thumb.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Redline">
    <meta name="twitter:description" content="Edit video by striking words out of its transcript. On-device Whisper, WebCodecs export, nothing uploaded.">
    <meta name="twitter:image" content="https://kevin-freitas-wwt.github.io/experiments/Redline/thumb.png">
    <meta name="theme-color" content="#f4efe6" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#161412" media="(prefers-color-scheme: dark)">
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="redline.css">
</head>
<body>
    <header class="bar">
        <a class="mark" href="../">
            <svg viewBox="0 0 28 28" aria-hidden="true"><path d="M5 9h18M5 14h12M5 19h16" /><path class="mark-red" d="M3 13.5c6-2 16 2 22-1" /></svg>
            <span>Redline</span>
        </a>
        <div class="bar-status" id="status" aria-live="polite"></div>
    </header>

    <main id="main" class="main is-empty">
        <section class="drop" id="drop">
            <svg class="drop-art" viewBox="0 0 320 200" aria-hidden="true">
                <rect class="art-paper" x="24" y="20" width="272" height="160" rx="6" />
                <g class="art-strip">
                    <rect x="40" y="36" width="88" height="56" rx="3" />
                    <rect x="46" y="42" width="6" height="6" rx="1" /><rect x="46" y="54" width="6" height="6" rx="1" /><rect x="46" y="66" width="6" height="6" rx="1" /><rect x="46" y="78" width="6" height="6" rx="1" />
                    <rect x="116" y="42" width="6" height="6" rx="1" /><rect x="116" y="54" width="6" height="6" rx="1" /><rect x="116" y="66" width="6" height="6" rx="1" /><rect x="116" y="78" width="6" height="6" rx="1" />
                    <path class="art-play" d="M78 54v20l16-10z" />
                </g>
                <g class="art-lines">
                    <path d="M146 44h120" /><path d="M146 58h96" /><path d="M146 72h112" /><path d="M146 86h70" />
                    <path d="M40 112h236" /><path d="M40 126h180" /><path d="M40 140h210" /><path d="M40 154h130" />
                </g>
                <path class="art-red" d="M158 125c40-5 90 4 128-3" />
                <path class="art-red" d="M40 139c40-4 60 5 100-2" />
            </svg>
            <h1>Edit a video by striking words from its transcript.</h1>
            <p>Drop a video here. It is transcribed on this device, every word tied to its frame. Select words, redline them, and export a cut with those moments gone. Nothing is uploaded.</p>
            <label class="btn btn-primary" for="file">Choose a video</label>
            <input type="file" id="file" accept="video/*,.mov,.mp4,.m4v" hidden>
            <div class="drop-foot">
                <label>Model
                    <select id="model">
                        <option value="auto">Auto (best for this device)</option>
                        <option value="onnx-community/whisper-small.en_timestamped">whisper-small.en · most accurate</option>
                        <option value="onnx-community/whisper-base.en_timestamped">whisper-base.en · balanced</option>
                        <option value="onnx-community/whisper-tiny.en_timestamped">whisper-tiny.en · fastest</option>
                    </select>
                </label>
                <span id="caps"></span>
            </div>
        </section>

        <section class="stage" id="stage" hidden>
            <div class="player">
                <div class="frame">
                    <video id="video" playsinline controls preload="metadata"></video>
                    <div class="skip" id="skip" aria-hidden="true"><span>skip</span></div>
                </div>
                <div class="strip" id="strip" role="slider" aria-label="Timeline" tabindex="0">
                    <div class="strip-cuts" id="stripCuts"></div>
                    <div class="strip-head" id="stripHead"></div>
                </div>
                <div class="readout">
                    <span class="tc" id="tcNow">00:00.00</span>
                    <span class="readout-right">
                        <span id="tcLen"></span><span class="readout-cut" id="tcCut"></span>
                        <button class="seg" id="timeMode" title="Show timecodes as source or output (rippled) time" aria-pressed="false"><span>source</span><span>output</span></button>
                    </span>
                </div>
                <div class="filecard">
                    <span class="filecard-name" id="fileName"></span>
                    <span class="filecard-meta" id="fileMeta"></span>
                </div>
            </div>

            <div class="doc">
                <div class="tools" id="tools">
                    <button class="btn btn-red" id="btnRedline" disabled title="Strike the selected words (Delete)">
                        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 8.5c4-1.5 8 1.5 12-.5" /></svg>Redline
                    </button>
                    <button class="btn" id="btnRestore" disabled title="Un-strike the selected words">Restore</button>
                    <button class="btn btn-icon" id="btnUndo" disabled title="Undo (⌘Z)">
                        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6 4L2.5 7.5 6 11" /><path d="M3 7.5h6a4 4 0 010 8H8" /></svg>
                    </button>
                    <button class="btn" id="btnFillers" disabled title="Strike every um, uh, you know, stutter and repeated phrase">Fillers</button>
                    <span class="tools-gap"></span>
                    <span class="tools-note" id="toolsNote"></span>
                    <div class="menu" id="tmenu">
                        <button class="btn" id="btnTranscript" disabled aria-haspopup="true" aria-expanded="false">Transcript
                            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 6l4 4 4-4" /></svg>
                        </button>
                        <div class="menu-pop" id="tmenuPop" hidden>
                            <button data-fmt="srt">SubRip .srt</button>
                            <button data-fmt="vtt">WebVTT .vtt</button>
                            <button data-fmt="txt">Plain text .txt</button>
                            <label><input type="checkbox" id="tmenuKeep"> include struck words</label>
                        </div>
                    </div>
                    <button class="btn btn-primary" id="btnExport" disabled>Export video</button>
                </div>
                <div class="progress" id="progress" hidden>
                    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
                    <div class="progress-text" id="progressText"></div>
                </div>
                <article class="transcript" id="transcript"></article>
            </div>
        </section>
    </main>

    <div class="float" id="float" hidden>
        <button class="btn btn-red" id="floatRedline">Redline</button>
        <button class="btn" id="floatRestore">Restore</button>
    </div>

    <dialog class="sheet" id="exportSheet">
        <h2 id="exportTitle">Exporting</h2>
        <p class="sheet-sub" id="exportSub"></p>
        <div class="progress-bar"><div class="progress-fill" id="exportFill"></div></div>
        <div class="sheet-row">
            <span class="sheet-text" id="exportText"></span>
            <button class="btn" id="exportCancel">Cancel</button>
            <a class="btn btn-primary" id="exportDownload" hidden download>Download</a>
            <button class="btn btn-primary" id="exportDone" hidden>Done</button>
        </div>
    </dialog>

    <script type="module" src="app.js"></script>
</body>
</html>
