<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Scanr</title>
<meta name="description" content="A slit-scan camera for the pocket. Sweep your phone to build an image one slice at a time.">
<meta property="og:title" content="Scanr">
<meta property="og:description" content="A slit-scan camera for the pocket. Sweep your phone to build an image one slice at a time.">
<meta property="og:type" content="website">
<meta property="og:image" content="og.png">
<style>
    :root {
        --accent: #ffb800;
        --hairline: rgba( 255, 255, 255, .14 );
        --ink: #f2f2f2;
        --ink-dim: rgba( 255, 255, 255, .45 );
        --mono: "SF Mono", ui-monospace, Menlo, monospace;
        --panel: #0a0a0a;
        --rec: #ff3b30;
        --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }
    html, body {
        height: 100%;
        overscroll-behavior: none;
    }
    body {
        background: #000;
        color: var( --ink );
        display: flex;
        flex-direction: column;
        font-family: var( --sans );
        height: 100dvh;
        overflow: hidden;
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
        user-select: none;
    }
    .viewfinder {
        background: #000;
        flex: 1;
        min-height: 0;
        overflow: hidden;
        position: relative;
    }
    .viewfinder video {
        height: 100%;
        object-fit: cover;
        transform-origin: center;
        width: 100%;
    }
    .brand {
        color: var( --ink-dim );
        font-family: var( --mono );
        font-size: 11px;
        left: 14px;
        letter-spacing: .35em;
        position: absolute;
        text-shadow: 0 1px 2px rgba( 0, 0, 0, .6 );
        top: calc( env( safe-area-inset-top, 0px ) + 14px );
        z-index: 2;
    }
    .slice-line {
        background: var( --accent );
        opacity: .85;
        position: absolute;
        transition: background .2s;
        z-index: 2;
    }
    .slice-line.v {
        bottom: 0;
        left: 50%;
        top: 0;
        transform: translateX( -50% );
        width: 1px;
    }
    .slice-line.h {
        height: 1px;
        left: 0;
        right: 0;
        top: 50%;
        transform: translateY( -50% );
    }
    body.rec .slice-line {
        background: var( --rec );
    }
    .stab-badge {
        color: var( --accent );
        font-family: var( --mono );
        font-size: 10px;
        letter-spacing: .2em;
        opacity: 0;
        position: absolute;
        right: 14px;
        text-shadow: 0 1px 2px rgba( 0, 0, 0, .6 );
        top: calc( env( safe-area-inset-top, 0px ) + 14px );
        transition: opacity .2s;
        z-index: 2;
    }
    body.stab .stab-badge {
        opacity: 1;
    }
    .panel {
        background: var( --panel );
        border-top: 1px solid var( --hairline );
        flex-shrink: 0;
    }
    .row {
        align-items: center;
        display: flex;
        gap: 10px;
        padding: 10px 14px;
    }
    .row + .row {
        border-top: 1px solid var( --hairline );
    }
    .row label {
        color: var( --ink-dim );
        font-family: var( --mono );
        font-size: 10px;
        letter-spacing: .15em;
        min-width: 44px;
    }
    input[type=range] {
        appearance: none;
        background: transparent;
        flex: 1;
        height: 28px;
        -webkit-appearance: none;
    }
    input[type=range]::-webkit-slider-runnable-track {
        background: var( --hairline );
        border-radius: 1px;
        height: 2px;
    }
    input[type=range]::-webkit-slider-thumb {
        appearance: none;
        background: var( --ink );
        border-radius: 50%;
        height: 18px;
        margin-top: -8px;
        -webkit-appearance: none;
        width: 18px;
    }
    input[type=range]::-moz-range-track {
        background: var( --hairline );
        border-radius: 1px;
        height: 2px;
    }
    input[type=range]::-moz-range-thumb {
        background: var( --ink );
        border: none;
        border-radius: 50%;
        height: 18px;
        width: 18px;
    }
    .readout {
        color: var( --accent );
        font-family: var( --mono );
        font-size: 12px;
        min-width: 42px;
        text-align: right;
    }
    .seg {
        border: 1px solid var( --hairline );
        border-radius: 7px;
        display: flex;
        overflow: hidden;
    }
    .seg button {
        background: transparent;
        border: none;
        border-right: 1px solid var( --hairline );
        color: var( --ink-dim );
        font-family: var( --mono );
        font-size: 11px;
        padding: 7px 0;
        width: 44px;
    }
    .seg button:last-child {
        border-right: none;
    }
    .seg button.on {
        background: rgba( 255, 184, 0, .12 );
        color: var( --accent );
    }
    .seg button svg {
        display: block;
        margin: 0 auto;
    }
    .switch {
        background: var( --hairline );
        border: none;
        border-radius: 999px;
        height: 24px;
        position: relative;
        transition: background .2s;
        width: 42px;
    }
    .switch::after {
        background: var( --ink );
        border-radius: 50%;
        content: "";
        height: 18px;
        left: 3px;
        position: absolute;
        top: 3px;
        transition: transform .2s;
        width: 18px;
    }
    .switch.on {
        background: var( --accent );
    }
    .switch.on::after {
        transform: translateX( 18px );
    }
    .spacer {
        flex: 1;
    }
    .preview {
        background: #050505;
        height: 128px;
        overflow: auto;
        position: relative;
        scrollbar-width: none;
    }
    .preview::-webkit-scrollbar {
        display: none;
    }
    .preview canvas {
        display: block;
        image-rendering: pixelated;
    }
    .preview.v canvas {
        height: 128px;
        width: auto;
    }
    .preview.h canvas {
        height: auto;
        width: 128px;
    }
    .preview.flip-x canvas {
        transform: scaleX( -1 );
    }
    .preview.flip-y canvas {
        transform: scaleY( -1 );
    }
    .preview .empty {
        color: var( --ink-dim );
        font-family: var( --mono );
        font-size: 10px;
        left: 50%;
        letter-spacing: .25em;
        position: absolute;
        top: 50%;
        transform: translate( -50%, -50% );
    }
    .meta {
        border-top: 1px solid var( --hairline );
        justify-content: space-between;
        padding: 6px 14px;
    }
    .meta span {
        color: var( --ink-dim );
        font-family: var( --mono );
        font-size: 10px;
        letter-spacing: .12em;
    }
    .meta .save {
        background: transparent;
        border: 1px solid var( --hairline );
        border-radius: 6px;
        color: var( --accent );
        font-family: var( --mono );
        font-size: 10px;
        letter-spacing: .12em;
        padding: 5px 12px;
        visibility: hidden;
    }
    body.has-scan:not(.rec) .meta .save {
        visibility: visible;
    }
    .shutter-bar {
        display: flex;
        justify-content: center;
        padding: 14px 0 calc( env( safe-area-inset-bottom, 0px ) + 14px );
    }
    .shutter {
        background: #fff;
        border: 3px solid #fff;
        border-radius: 50%;
        height: 72px;
        position: relative;
        transition: background .18s;
        width: 72px;
    }
    .shutter::after {
        background: var( --rec );
        border-radius: 6px;
        content: "";
        height: 28px;
        left: 50%;
        opacity: 0;
        position: absolute;
        top: 50%;
        transform: translate( -50%, -50% ) scale( .4 );
        transition: opacity .18s, transform .18s;
        width: 28px;
    }
    body.rec .shutter {
        background: transparent;
    }
    body.rec .shutter::after {
        opacity: 1;
        transform: translate( -50%, -50% ) scale( 1 );
    }
</style>
</head>
<body>
    <div class="viewfinder">
        <video id="cam" autoplay muted playsinline></video>
        <span class="brand">SCANR</span>
        <span class="stab-badge">STAB</span>
        <div class="slice-line v" id="sliceLine"></div>
    </div>
    <div class="panel">
        <div class="row">
            <label>ZOOM</label>
            <input type="range" id="zoom" min="1" max="5" step="0.1" value="1">
            <span class="readout" id="zoomOut">1.0&times;</span>
        </div>
        <div class="row">
            <label>DIR</label>
            <div class="seg" id="dirSeg">
                <button data-dir="lr" class="on" aria-label="left to right">
                    <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 7h10M8 3l4 4-4 4"/></svg>
                </button>
                <button data-dir="rl" aria-label="right to left">
                    <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 7H2M6 3L2 7l4 4"/></svg>
                </button>
                <button data-dir="tb" aria-label="top to bottom">
                    <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M7 2v10M3 8l4 4 4-4"/></svg>
                </button>
                <button data-dir="bt" aria-label="bottom to top">
                    <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M7 12V2M3 6l4-4 4 4"/></svg>
                </button>
            </div>
            <div class="seg" id="sliceSeg">
                <button data-slice="1" class="on">1</button>
                <button data-slice="10">10</button>
                <button data-slice="100">100</button>
            </div>
            <div class="spacer"></div>
            <label>STAB</label>
            <button class="switch" id="stab" aria-label="stabilize"></button>
        </div>
    </div>
    <div class="preview v" id="preview">
        <span class="empty" id="emptyMsg">NO SCAN</span>
        <canvas id="scan" width="1024" height="720" hidden></canvas>
    </div>
    <div class="panel">
        <div class="row meta">
            <span id="metaOut">READY &middot; 1PX &middot; L&rarr;R</span>
            <button class="save" id="save">SAVE PNG</button>
        </div>
        <div class="shutter-bar">
            <button class="shutter" id="shutter" aria-label="capture"></button>
        </div>
    </div>
<script>
( function() {

    var video = document.getElementById( 'cam' ),
        preview = document.getElementById( 'preview' ),
        scan = document.getElementById( 'scan' ),
        ctx = scan.getContext( '2d' ),
        sliceLine = document.getElementById( 'sliceLine' ),
        metaOut = document.getElementById( 'metaOut' ),
        zoomOut = document.getElementById( 'zoomOut' ),
        emptyMsg = document.getElementById( 'emptyMsg' ),
        MAX_LEN = 16384,
        BAND = 720;

    var st = {
        dir: 'lr',
        slice: 1,
        zoom: 1,
        stab: false,
        rec: false,
        len: 0,
        has: false,
        drift: 0,
        frame: 0
    };

    function isVertical() {
        return st.dir === 'lr' || st.dir === 'rl';
    }

    function dirLabel() {
        return { lr: 'L→R', rl: 'R→L', tb: 'T→B', bt: 'B→T' }[ st.dir ];
    }

    function meta( state ) {
        metaOut.innerHTML = state + ' &middot; ' + st.slice + 'PX &middot; ' + dirLabel() +
            ( st.len ? ' &middot; ' + st.len + 'PX' : '' );
    }

    function startCamera() {
        if ( location.search.indexOf( 'demo' ) > -1 ) return startDemo();
        navigator.mediaDevices.getUserMedia( {
            audio: false,
            video: { facingMode: 'environment', width: { ideal: 1920 } }
        } ).then( function( stream ) {
            video.srcObject = stream;
        } ).catch( startDemo );
    }

    function startDemo() {
        var c = document.createElement( 'canvas' ),
            g = c.getContext( '2d' ),
            t = 0;
        c.width = 1280;
        c.height = 720;
        ( function draw() {
            var i, x;
            for ( i = 0; i < 32; i++ ) {
                x = ( i * 60 + t * 90 ) % ( c.width + 120 ) - 120;
                g.fillStyle = 'hsl(' + ( i * 29 % 360 ) + ' 65% ' + ( 25 + i % 4 * 12 ) + '%)';
                g.fillRect( x, 0, 60, c.height );
            }
            g.fillStyle = 'rgba(255,255,255,.9)';
            g.font = '700 90px monospace';
            g.fillText( 'TEST', 80 + Math.sin( t ) * 40, 380 );
            t += 0.016;
            requestAnimationFrame( draw );
        } )();
        video.srcObject = c.captureStream( 30 );
    }

    function setZoom( z ) {
        st.zoom = z;
        video.style.transform = 'scale(' + z + ')';
        zoomOut.innerHTML = z.toFixed( 1 ) + '&times;';
    }

    function resetScan() {
        var v = isVertical();
        scan.width = v ? 1024 : BAND;
        scan.height = v ? BAND : 1024;
        st.len = 0;
        st.has = false;
        document.body.classList.remove( 'has-scan' );
        preview.className = 'preview ' + ( v ? 'v' : 'h' ) +
            ( st.dir === 'rl' ? ' flip-x' : st.dir === 'bt' ? ' flip-y' : '' );
        scan.hidden = true;
        emptyMsg.hidden = false;
    }

    function grow() {
        var copy = document.createElement( 'canvas' );
        copy.width = scan.width;
        copy.height = scan.height;
        copy.getContext( '2d' ).drawImage( scan, 0, 0 );
        if ( isVertical() ) scan.width = Math.min( scan.width * 2, MAX_LEN );
        else scan.height = Math.min( scan.height * 2, MAX_LEN );
        ctx.drawImage( copy, 0, 0 );
    }

    var RATE = { 1: 1, 10: 8, 100: 80 },
        tmp = document.createElement( 'canvas' ),
        tg = tmp.getContext( '2d' );

    function feather( v, over, band ) {
        var g = v ? tg.createLinearGradient( 0, 0, over, 0 ) :
                    tg.createLinearGradient( 0, 0, 0, over );
        g.addColorStop( 0, 'rgba(0,0,0,1)' );
        g.addColorStop( 1, 'rgba(0,0,0,0)' );
        tg.globalCompositeOperation = 'destination-out';
        tg.fillStyle = g;
        if ( v ) tg.fillRect( 0, 0, over, band );
        else tg.fillRect( 0, 0, band, over );
    }

    function capture() {
        if ( !st.rec ) return;
        requestAnimationFrame( capture );
        if ( st.frame++ % RATE[ st.slice ] ) return;
        var vw = video.videoWidth,
            vh = video.videoHeight,
            v = isVertical(),
            over = st.slice > 1 && st.len ? st.slice / 5 : 0,
            dest = st.slice + over,
            cw, ch, cx, cy, scale, srcSize, srcPos, shift;
        if ( !vw || !vh ) return;
        cw = vw / st.zoom;
        ch = vh / st.zoom;
        cx = ( vw - cw ) / 2;
        cy = ( vh - ch ) / 2;
        scale = BAND / ( v ? ch : cw );
        srcSize = Math.max( 1, dest / scale );
        shift = st.stab ? st.drift : 0;
        if ( v ) {
            srcPos = Math.min( Math.max( cx + cw / 2 - srcSize / 2 + shift, cx ), cx + cw - srcSize );
            if ( st.len + st.slice > scan.width ) {
                if ( scan.width >= MAX_LEN ) return stop();
                grow();
            }
            if ( over ) {
                tmp.width = dest;
                tmp.height = BAND;
                tg.drawImage( video, srcPos, cy, srcSize, ch, 0, 0, dest, BAND );
                feather( true, over, BAND );
                ctx.drawImage( tmp, st.len - over, 0 );
            } else {
                ctx.drawImage( video, srcPos, cy, srcSize, ch, st.len, 0, st.slice, BAND );
            }
            preview.scrollLeft = st.len * 128 / BAND - preview.clientWidth;
        } else {
            srcPos = Math.min( Math.max( cy + ch / 2 - srcSize / 2 + shift, cy ), cy + ch - srcSize );
            if ( st.len + st.slice > scan.height ) {
                if ( scan.height >= MAX_LEN ) return stop();
                grow();
            }
            if ( over ) {
                tmp.width = BAND;
                tmp.height = dest;
                tg.drawImage( video, cx, srcPos, cw, srcSize, 0, 0, BAND, dest );
                feather( false, over, BAND );
                ctx.drawImage( tmp, 0, st.len - over );
            } else {
                ctx.drawImage( video, cx, srcPos, cw, srcSize, 0, st.len, BAND, st.slice );
            }
            preview.scrollTop = st.len * 128 / BAND - preview.clientHeight;
        }
        st.len += st.slice;
        if ( !st.has ) {
            st.has = true;
            scan.hidden = false;
            emptyMsg.hidden = true;
            document.body.classList.add( 'has-scan' );
        }
        meta( 'REC' );
    }

    function start() {
        st.rec = true;
        st.drift = 0;
        st.frame = 0;
        resetScan();
        st.has = false;
        document.body.classList.add( 'rec' );
        meta( 'REC' );
        requestAnimationFrame( capture );
    }

    function stop() {
        st.rec = false;
        document.body.classList.remove( 'rec' );
        if ( st.has && st.len ) {
            crop();
            document.body.classList.add( 'has-scan' );
        }
        meta( 'DONE' );
    }

    function crop() {
        var v = isVertical(),
            copy = document.createElement( 'canvas' );
        copy.width = v ? st.len : BAND;
        copy.height = v ? BAND : st.len;
        copy.getContext( '2d' ).drawImage( scan, 0, 0 );
        scan.width = copy.width;
        scan.height = copy.height;
        ctx.drawImage( copy, 0, 0 );
    }

    function savePng() {
        var out = scan,
            flip, g, a;
        if ( st.dir === 'rl' || st.dir === 'bt' ) {
            flip = document.createElement( 'canvas' );
            flip.width = scan.width;
            flip.height = scan.height;
            g = flip.getContext( '2d' );
            if ( st.dir === 'rl' ) { g.scale( -1, 1 ); g.drawImage( scan, -scan.width, 0 ); }
            else { g.scale( 1, -1 ); g.drawImage( scan, 0, -scan.height ); }
            out = flip;
        }
        a = document.createElement( 'a' );
        a.download = 'scanr-' + Date.now() + '.png';
        a.href = out.toDataURL( 'image/png' );
        a.click();
    }

    var lastMotion = 0;

    function onMotion( e ) {
        var now = performance.now(),
            dt = lastMotion ? ( now - lastMotion ) / 1000 : 0,
            r = e.rotationRate,
            rate;
        lastMotion = now;
        if ( !r || !dt ) return;
        rate = isVertical() ? ( r.gamma || 0 ) : ( r.beta || 0 );
        st.drift += Math.tan( rate * Math.PI / 180 * dt ) * video.videoWidth;
        st.drift *= 0.92;
    }

    function enableStab() {
        if ( typeof DeviceMotionEvent !== 'undefined' &&
             typeof DeviceMotionEvent.requestPermission === 'function' ) {
            DeviceMotionEvent.requestPermission().then( function( res ) {
                if ( res === 'granted' ) attachStab();
            } ).catch( function() {} );
        } else {
            attachStab();
        }
    }

    function attachStab() {
        st.stab = true;
        document.body.classList.add( 'stab' );
        document.getElementById( 'stab' ).classList.add( 'on' );
        window.addEventListener( 'devicemotion', onMotion );
    }

    function seg( id, attr, fn ) {
        var el = document.getElementById( id );
        el.addEventListener( 'click', function( e ) {
            var b = e.target.closest( 'button' );
            if ( !b ) return;
            el.querySelectorAll( 'button' ).forEach( function( x ) { x.classList.remove( 'on' ); } );
            b.classList.add( 'on' );
            fn( b.dataset[ attr ] );
        } );
    }

    document.getElementById( 'zoom' ).addEventListener( 'input', function( e ) {
        setZoom( parseFloat( e.target.value ) );
    } );

    seg( 'dirSeg', 'dir', function( d ) {
        if ( st.rec ) stop();
        st.dir = d;
        sliceLine.className = 'slice-line ' + ( isVertical() ? 'v' : 'h' );
        resetScan();
        meta( 'READY' );
    } );

    seg( 'sliceSeg', 'slice', function( s ) {
        st.slice = parseInt( s, 10 );
        meta( st.rec ? 'REC' : 'READY' );
    } );

    document.getElementById( 'stab' ).addEventListener( 'click', function() {
        if ( st.stab ) {
            st.stab = false;
            st.drift = 0;
            document.body.classList.remove( 'stab' );
            this.classList.remove( 'on' );
            window.removeEventListener( 'devicemotion', onMotion );
        } else {
            enableStab();
        }
    } );

    document.getElementById( 'shutter' ).addEventListener( 'click', function() {
        st.rec ? stop() : start();
    } );

    document.getElementById( 'save' ).addEventListener( 'click', savePng );

    resetScan();
    startCamera();

} )();
</script>
</body>
</html>
