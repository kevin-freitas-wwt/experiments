<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Scanr</title>
<meta name="description" content="A slit-scan camera for the pocket. Sweep your phone to build an image one slice at a time.">
<meta property="og:title" content="Scanr">
<meta property="og:description" content="A slit-scan camera for the pocket. Sweep your phone to build an image one slice at a time.">
<meta property="og:type" content="website">
<meta property="og:image" content="og.png">
<style>
    :root {
        --accent: #ffb800;
        --hairline: rgba( 255, 255, 255, .14 );
        --ink: #f2f2f2;
        --ink-dim: rgba( 255, 255, 255, .45 );
        --mono: "SF Mono", ui-monospace, Menlo, monospace;
        --panel: #0a0a0a;
        --rec: #ff3b30;
        --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }
    html, body {
        height: 100%;
        overscroll-behavior: none;
    }
    body {
        background: #000;
        color: var( --ink );
        display: flex;
        flex-direction: column;
        font-family: var( --sans );
        height: 100dvh;
        overflow: hidden;
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
        user-select: none;
    }
    .viewfinder {
        background: #000;
        flex: 1;
        min-height: 0;
        overflow: hidden;
        position: relative;
    }
    .viewfinder video {
        height: 100%;
        object-fit: cover;
        transform-origin: center;
        width: 100%;
    }
    .brand {
        color: var( --ink-dim );
        font-family: var( --mono );
        font-size: 11px;
        left: 14px;
        letter-spacing: .35em;
        position: absolute;
        text-shadow: 0 1px 2px rgba( 0, 0, 0, .6 );
        top: calc( env( safe-area-inset-top, 0px ) + 14px );
        z-index: 2;
    }
    .slice-line {
        background: var( --accent );
        opacity: .85;
        position: absolute;
        transition: background .2s;
        z-index: 2;
    }
    .slice-line.v {
        bottom: 0;
        left: 50%;
        top: 0;
        transform: translateX( -50% );
        width: 1px;
    }
    .slice-line.h {
        height: 1px;
        left: 0;
        right: 0;
        top: 50%;
        transform: translateY( -50% );
    }
    body.rec .slice-line {
        background: var( --rec );
    }
    .stab-badge {
        color: var( --accent );
        font-family: var( --mono );
        font-size: 10px;
        letter-spacing: .2em;
        opacity: 0;
        position: absolute;
        right: 14px;
        text-shadow: 0 1px 2px rgba( 0, 0, 0, .6 );
        top: calc( env( safe-area-inset-top, 0px ) + 14px );
        transition: opacity .2s;
        z-index: 2;
    }
    body.stab .stab-badge {
        opacity: 1;
    }
    body.mode-img #stab,
    body.mode-img #stabLabel {
        opacity: .35;
        pointer-events: none;
    }
    .meter {
        background: rgba( 0, 0, 0, .35 );
        border: 1px solid var( --hairline );
        border-radius: 2px;
        bottom: 14px;
        height: 4px;
        left: 50%;
        opacity: 0;
        position: absolute;
        transform: translateX( -50% );
        transition: opacity .2s;
        width: 44%;
        z-index: 2;
    }
    body.rec.motion .meter {
        opacity: 1;
    }
    .meter-fill {
        background: var( --accent );
        border-radius: 2px;
        height: 100%;
        transition: width .1s linear;
        width: 0;
    }
    .meter-fill.over {
        background: var( --rec );
    }
    .meter-mark {
        background: var( --ink );
        bottom: -3px;
        left: 66.7%;
        position: absolute;
        top: -3px;
        width: 1px;
    }
    .panel {
        background: var( --panel );
        border-top: 1px solid var( --hairline );
        flex-shrink: 0;
    }
    .row {
        align-items: center;
        display: flex;
        gap: 10px;
        padding: 10px 14px;
    }
    .row + .row {
        border-top: 1px solid var( --hairline );
    }
    .row label {
        color: var( --ink-dim );
        font-family: var( --mono );
        font-size: 10px;
        letter-spacing: .15em;
        min-width: 44px;
    }
    input[type=range] {
        appearance: none;
        background: transparent;
        flex: 1;
        height: 28px;
        -webkit-appearance: none;
    }
    input[type=range]::-webkit-slider-runnable-track {
        background: var( --hairline );
        border-radius: 1px;
        height: 2px;
    }
    input[type=range]::-webkit-slider-thumb {
        appearance: none;
        background: var( --ink );
        border-radius: 50%;
        height: 18px;
        margin-top: -8px;
        -webkit-appearance: none;
        width: 18px;
    }
    input[type=range]::-moz-range-track {
        background: var( --hairline );
        border-radius: 1px;
        height: 2px;
    }
    input[type=range]::-moz-range-thumb {
        background: var( --ink );
        border: none;
        border-radius: 50%;
        height: 18px;
        width: 18px;
    }
    .readout {
        color: var( --accent );
        font-family: var( --mono );
        font-size: 12px;
        min-width: 42px;
        text-align: right;
    }
    .seg {
        border: 1px solid var( --hairline );
        border-radius: 7px;
        display: flex;
        overflow: hidden;
    }
    .seg button {
        background: transparent;
        border: none;
        border-right: 1px solid var( --hairline );
        color: var( --ink-dim );
        font-family: var( --mono );
        font-size: 11px;
        padding: 7px 0;
        width: 44px;
    }
    .seg button:last-child {
        border-right: none;
    }
    .seg button.on {
        background: rgba( 255, 184, 0, .12 );
        color: var( --accent );
    }
    .seg button svg {
        display: block;
        margin: 0 auto;
    }
    .switch {
        background: var( --hairline );
        border: none;
        border-radius: 999px;
        height: 24px;
        position: relative;
        transition: background .2s;
        width: 42px;
    }
    .switch::after {
        background: var( --ink );
        border-radius: 50%;
        content: "";
        height: 18px;
        left: 3px;
        position: absolute;
        top: 3px;
        transition: transform .2s;
        width: 18px;
    }
    .switch.on {
        background: var( --accent );
    }
    .switch.on::after {
        transform: translateX( 18px );
    }
    .spacer {
        flex: 1;
    }
    .preview {
        background: #050505;
        height: 128px;
        overflow: auto;
        position: relative;
        scrollbar-width: none;
    }
    .preview::-webkit-scrollbar {
        display: none;
    }
    .preview canvas {
        display: block;
        image-rendering: pixelated;
    }
    .preview.v canvas {
        height: 128px;
        width: auto;
    }
    .preview.h canvas {
        height: auto;
        width: 128px;
    }
    .preview.flip-x canvas {
        transform: scaleX( -1 );
    }
    .preview.flip-y canvas {
        transform: scaleY( -1 );
    }
    .preview .empty {
        color: var( --ink-dim );
        font-family: var( --mono );
        font-size: 10px;
        left: 50%;
        letter-spacing: .25em;
        position: absolute;
        top: 50%;
        transform: translate( -50%, -50% );
    }
    .meta {
        border-top: 1px solid var( --hairline );
        justify-content: space-between;
        padding: 6px 14px;
    }
    .meta span {
        color: var( --ink-dim );
        font-family: var( --mono );
        font-size: 10px;
        letter-spacing: .12em;
    }
    .meta .save {
        background: transparent;
        border: 1px solid var( --hairline );
        border-radius: 6px;
        color: var( --accent );
        font-family: var( --mono );
        font-size: 10px;
        letter-spacing: .12em;
        padding: 5px 12px;
        visibility: hidden;
    }
    body.has-scan:not(.rec) .meta .save {
        visibility: visible;
    }
    .viewer {
        background: #000;
        inset: 0;
        overflow: hidden;
        position: fixed;
        touch-action: none;
        z-index: 10;
    }
    .viewer[hidden] {
        display: none;
    }
    .viewer canvas {
        left: 0;
        position: absolute;
        top: 0;
        transform-origin: 0 0;
    }
    .viewer-close {
        align-items: center;
        background: rgba( 0, 0, 0, .5 );
        border: 1px solid var( --hairline );
        border-radius: 50%;
        color: var( --ink );
        display: flex;
        height: 40px;
        justify-content: center;
        position: absolute;
        right: 14px;
        top: calc( env( safe-area-inset-top, 0px ) + 14px );
        width: 40px;
        z-index: 2;
    }
    .viewer-save {
        background: rgba( 0, 0, 0, .5 );
        border: 1px solid var( --hairline );
        border-radius: 6px;
        bottom: calc( env( safe-area-inset-bottom, 0px ) + 20px );
        color: var( --accent );
        font-family: var( --mono );
        font-size: 11px;
        left: 50%;
        letter-spacing: .12em;
        padding: 10px 22px;
        position: absolute;
        transform: translateX( -50% );
        z-index: 2;
    }
    body.has-scan:not(.rec) .preview {
        cursor: pointer;
    }
    .shutter-bar {
        display: flex;
        justify-content: center;
        padding: 14px 0 calc( env( safe-area-inset-bottom, 0px ) + 14px );
    }
    .shutter {
        background: #fff;
        border: 3px solid #fff;
        border-radius: 50%;
        height: 72px;
        position: relative;
        transition: background .18s;
        width: 72px;
    }
    .shutter::after {
        background: var( --rec );
        border-radius: 6px;
        content: "";
        height: 28px;
        left: 50%;
        opacity: 0;
        position: absolute;
        top: 50%;
        transform: translate( -50%, -50% ) scale( .4 );
        transition: opacity .18s, transform .18s;
        width: 28px;
    }
    body.rec .shutter {
        background: transparent;
    }
    body.rec .shutter::after {
        opacity: 1;
        transform: translate( -50%, -50% ) scale( 1 );
    }
</style>
</head>
<body>
    <div class="viewfinder">
        <video id="cam" autoplay muted playsinline></video>
        <span class="brand">SCANR</span>
        <span class="stab-badge">STAB</span>
        <div class="slice-line v" id="sliceLine"></div>
        <div class="meter">
            <div class="meter-fill" id="meterFill"></div>
            <div class="meter-mark"></div>
        </div>
    </div>
    <div class="panel">
        <div class="row">
            <label>ZOOM</label>
            <input type="range" id="zoom" min="1" max="5" step="0.1" value="1">
            <span class="readout" id="zoomOut">1.0&times;</span>
            <div class="seg" id="modeSeg">
                <button data-mode="gyro" class="on">GYRO</button>
                <button data-mode="img">IMG</button>
            </div>
        </div>
        <div class="row">
            <label>DIR</label>
            <div class="seg" id="dirSeg">
                <button data-dir="lr" class="on" aria-label="left to right">
                    <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 7h10M8 3l4 4-4 4"/></svg>
                </button>
                <button data-dir="rl" aria-label="right to left">
                    <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 7H2M6 3L2 7l4 4"/></svg>
                </button>
                <button data-dir="tb" aria-label="top to bottom">
                    <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M7 2v10M3 8l4 4 4-4"/></svg>
                </button>
                <button data-dir="bt" aria-label="bottom to top">
                    <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M7 12V2M3 6l4-4 4 4"/></svg>
                </button>
            </div>
            <div class="seg" id="sliceSeg">
                <button data-slice="1" class="on">1</button>
                <button data-slice="10">10</button>
                <button data-slice="100">100</button>
            </div>
            <div class="spacer"></div>
            <label id="stabLabel">STAB</label>
            <button class="switch" id="stab" aria-label="stabilize"></button>
        </div>
    </div>
    <div class="preview v" id="preview">
        <span class="empty" id="emptyMsg">NO SCAN</span>
        <canvas id="scan" width="1024" height="720" hidden></canvas>
    </div>
    <div class="panel">
        <div class="row meta">
            <span id="metaOut">READY &middot; 1PX &middot; L&rarr;R</span>
            <button class="save" id="save">SAVE PNG</button>
        </div>
        <div class="shutter-bar">
            <button class="shutter" id="shutter" aria-label="capture"></button>
        </div>
    </div>
    <div class="viewer" id="viewer" hidden>
        <button class="viewer-close" id="viewerClose" aria-label="close">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 3l10 10M13 3L3 13"/></svg>
        </button>
        <button class="viewer-save" id="viewerSave">SAVE PNG</button>
    </div>
<script>
( function() {

    var video = document.getElementById( 'cam' ),
        preview = document.getElementById( 'preview' ),
        scan = document.getElementById( 'scan' ),
        ctx = scan.getContext( '2d' ),
        sliceLine = document.getElementById( 'sliceLine' ),
        metaOut = document.getElementById( 'metaOut' ),
        zoomOut = document.getElementById( 'zoomOut' ),
        emptyMsg = document.getElementById( 'emptyMsg' ),
        MAX_LEN = 16384,
        BAND = 720;

    var st = {
        dir: 'lr',
        slice: 1,
        zoom: 1,
        stab: false,
        rec: false,
        len: 0,
        has: false,
        drift: 0,
        sweep: 0,
        acc: 0,
        speed: 0,
        motion: false,
        mode: 'gyro',
        jitter: 0
    };

    function isVertical() {
        return st.dir === 'lr' || st.dir === 'rl';
    }

    function dirLabel() {
        return { lr: 'L→R', rl: 'R→L', tb: 'T→B', bt: 'B→T' }[ st.dir ];
    }

    function meta( state ) {
        metaOut.innerHTML = state + ' &middot; ' + st.slice + 'PX &middot; ' + dirLabel() +
            ( st.len ? ' &middot; ' + st.len + 'PX' : '' );
    }

    function startCamera() {
        if ( location.search.indexOf( 'demo' ) > -1 ) return startDemo();
        navigator.mediaDevices.getUserMedia( {
            audio: false,
            video: { facingMode: 'environment', width: { ideal: 1920 } }
        } ).then( function( stream ) {
            video.srcObject = stream;
        } ).catch( startDemo );
    }

    function startDemo() {
        var c = document.createElement( 'canvas' ),
            g = c.getContext( '2d' ),
            t = 0;
        c.width = 1280;
        c.height = 720;
        ( function draw() {
            var i, x;
            for ( i = 0; i < 32; i++ ) {
                x = ( i * 60 + t * 90 ) % ( c.width + 120 ) - 120;
                g.fillStyle = 'hsl(' + ( i * 29 % 360 ) + ' 65% ' + ( 25 + i % 4 * 12 ) + '%)';
                g.fillRect( x, 0, 60, c.height );
            }
            g.fillStyle = 'rgba(255,255,255,.9)';
            g.font = '700 90px monospace';
            g.fillText( 'TEST', 80 + Math.sin( t ) * 40, 380 );
            t += 0.016;
            requestAnimationFrame( draw );
        } )();
        video.srcObject = c.captureStream( 30 );
    }

    function setZoom( z ) {
        st.zoom = z;
        video.style.transform = 'scale(' + z + ')';
        zoomOut.innerHTML = z.toFixed( 1 ) + '&times;';
    }

    function resetScan() {
        var v = isVertical();
        scan.width = v ? 1024 : BAND;
        scan.height = v ? BAND : 1024;
        st.len = 0;
        st.has = false;
        document.body.classList.remove( 'has-scan' );
        preview.className = 'preview ' + ( v ? 'v' : 'h' ) +
            ( st.dir === 'rl' ? ' flip-x' : st.dir === 'bt' ? ' flip-y' : '' );
        scan.hidden = true;
        emptyMsg.hidden = false;
    }

    function grow() {
        var copy = document.createElement( 'canvas' );
        copy.width = scan.width;
        copy.height = scan.height;
        copy.getContext( '2d' ).drawImage( scan, 0, 0 );
        if ( isVertical() ) scan.width = Math.min( scan.width * 2, MAX_LEN );
        else scan.height = Math.min( scan.height * 2, MAX_LEN );
        ctx.drawImage( copy, 0, 0 );
    }

    var tmp = document.createElement( 'canvas' ),
        tg = tmp.getContext( '2d' ),
        meterFill = document.getElementById( 'meterFill' );

    function feather( v, over, band ) {
        var g = v ? tg.createLinearGradient( 0, 0, over, 0 ) :
                    tg.createLinearGradient( 0, 0, 0, over );
        g.addColorStop( 0, 'rgba(0,0,0,1)' );
        g.addColorStop( 1, 'rgba(0,0,0,0)' );
        tg.globalCompositeOperation = 'destination-out';
        tg.fillStyle = g;
        if ( v ) tg.fillRect( 0, 0, over, band );
        else tg.fillRect( 0, 0, band, over );
    }

    var AW = 128,
        AH = 96,
        alignC = document.createElement( 'canvas' ),
        alignG = null,
        prevGray = null;

    alignC.width = AW;
    alignC.height = AH;
    alignG = alignC.getContext( '2d', { willReadFrequently: true } );

    function sad( a, b, mx, my ) {
        var s = 0,
            x, y, r, rp;
        for ( y = 20; y < AH - 20; y += 2 ) {
            r = y * AW;
            rp = ( y - my ) * AW - mx;
            for ( x = 24; x < AW - 24; x += 2 ) s += Math.abs( a[ r + x ] - b[ rp + x ] );
        }
        return s;
    }

    function measureFlow( cx, cy, cw, ch, v ) {
        alignG.drawImage( video, cx, cy, cw, ch, 0, 0, AW, AH );
        var d = alignG.getImageData( 0, 0, AW, AH ).data,
            g = new Float32Array( AW * AH ),
            R = v ? 20 : 16,
            best = Infinity,
            bm = 0,
            bc = 0,
            i, j, m, c, s, s0, s1, s2, sub, prev;
        for ( i = 0, j = 0; j < g.length; i += 4, j++ ) g[ j ] = d[ i ] + 2 * d[ i + 1 ] + d[ i + 2 ];
        prev = prevGray;
        prevGray = g;
        if ( !prev ) return null;
        for ( m = -R; m <= R; m++ ) {
            for ( c = -3; c <= 3; c++ ) {
                s = v ? sad( g, prev, m, c ) : sad( g, prev, c, m );
                if ( s < best ) {
                    best = s;
                    bm = m;
                    bc = c;
                }
            }
        }
        s0 = best;
        s1 = Math.abs( bm ) < R ? ( v ? sad( g, prev, bm - 1, bc ) : sad( g, prev, bc, bm - 1 ) ) : s0;
        s2 = Math.abs( bm ) < R ? ( v ? sad( g, prev, bm + 1, bc ) : sad( g, prev, bc, bm + 1 ) ) : s0;
        if ( s0 * 8 < Math.min( s1, s2 ) ) sub = 0;
        else sub = Math.max( s1, s2 ) > s0 ? 0.5 * ( s1 - s2 ) / ( Math.max( s1, s2 ) - s0 ) : 0;
        return { main: bm + sub, cross: bc };
    }

    var MAXW = 160;

    function updateMeter() {
        var lim = Math.floor( MAXW / st.slice ) * st.slice,
            a = Math.abs( st.speed ),
            r = Math.min( a / lim, 1.5 );
        meterFill.style.width = ( r / 1.5 * 100 ) + '%';
        meterFill.classList.toggle( 'over', a > lim );
    }

    var vfcSeen = false,
        vfcTick = false;

    function onVFC() {
        vfcSeen = true;
        vfcTick = true;
        if ( st.rec ) video.requestVideoFrameCallback( onVFC );
    }

    function nextFrame() {
        if ( st.rec ) requestAnimationFrame( capture );
    }

    function capture() {
        nextFrame();
        var vw = video.videoWidth,
            vh = video.videoHeight,
            v = isVertical(),
            w, over, dest, destPx, angle, cw, ch, cx, cy, scale, srcSize, srcPos, shift,
            mrg, chS, cwS, flow, jit;
        if ( !st.rec || !vw || !vh ) return;
        if ( vfcSeen && !vfcTick ) return;
        vfcTick = false;
        angle = st.sweep;
        st.sweep = 0;
        cw = vw / st.zoom;
        ch = vh / st.zoom;
        cx = ( vw - cw ) / 2;
        cy = ( vh - ch ) / 2;
        mrg = st.mode === 'img' ? ( v ? ch : cw ) * 0.02 : 0;
        chS = v ? ch - 2 * mrg : ch;
        cwS = v ? cw : cw - 2 * mrg;
        scale = BAND / ( v ? chS : cwS );
        if ( st.mode === 'img' ) {
            flow = measureFlow( cx, cy, cw, ch, v );
            if ( !flow ) return;
            document.body.classList.add( 'motion' );
            destPx = flow.main * ( v ? cw / AW : ch / AH ) * scale;
            st.jitter = ( st.jitter + flow.cross * ( v ? ch / AH : cw / AW ) ) * 0.9;
        } else if ( st.motion ) {
            destPx = Math.tan( angle ) * vw * scale;
        } else {
            destPx = null;
        }
        if ( destPx !== null ) {
            st.speed = st.speed * 0.7 + destPx * 0.3;
            updateMeter();
            st.acc += destPx;
            w = Math.floor( Math.abs( st.acc ) / st.slice ) * st.slice;
            if ( !w ) return;
            w = Math.min( w, Math.floor( MAXW / st.slice ) * st.slice );
            st.acc -= st.acc > 0 ? w : -w;
            st.acc = Math.min( Math.max( st.acc, -MAXW ), MAXW );
        } else {
            w = st.slice;
        }
        over = st.len && w >= 8 ? Math.round( w / 5 ) : 0;
        dest = w + over;
        srcSize = Math.max( 1, dest / scale );
        shift = st.stab && st.mode === 'gyro' ? st.drift : 0;
        jit = Math.min( Math.max( st.jitter, -mrg ), mrg );
        if ( v ) {
            srcPos = Math.min( Math.max( cx + cw / 2 - srcSize / 2 + shift, cx ), cx + cw - srcSize );
            if ( st.len + w > scan.width ) {
                if ( scan.width >= MAX_LEN ) return stop();
                grow();
            }
            if ( over ) {
                tmp.width = dest;
                tmp.height = BAND;
                tg.drawImage( video, srcPos, cy + mrg + jit, srcSize, chS, 0, 0, dest, BAND );
                feather( true, over, BAND );
                ctx.drawImage( tmp, st.len - over, 0 );
            } else {
                ctx.drawImage( video, srcPos, cy + mrg + jit, srcSize, chS, st.len, 0, w, BAND );
            }
            preview.scrollLeft = st.len * 128 / BAND - preview.clientWidth;
        } else {
            srcPos = Math.min( Math.max( cy + ch / 2 - srcSize / 2 + shift, cy ), cy + ch - srcSize );
            if ( st.len + w > scan.height ) {
                if ( scan.height >= MAX_LEN ) return stop();
                grow();
            }
            if ( over ) {
                tmp.width = BAND;
                tmp.height = dest;
                tg.drawImage( video, cx + mrg + jit, srcPos, cwS, srcSize, 0, 0, BAND, dest );
                feather( false, over, BAND );
                ctx.drawImage( tmp, 0, st.len - over );
            } else {
                ctx.drawImage( video, cx + mrg + jit, srcPos, cwS, srcSize, 0, st.len, BAND, w );
            }
            preview.scrollTop = st.len * 128 / BAND - preview.clientHeight;
        }
        st.len += w;
        if ( !st.has ) {
            st.has = true;
            scan.hidden = false;
            emptyMsg.hidden = true;
            document.body.classList.add( 'has-scan' );
        }
        meta( 'REC' );
    }

    function start() {
        st.rec = true;
        st.drift = 0;
        st.sweep = 0;
        st.acc = 0;
        st.speed = 0;
        st.jitter = 0;
        prevGray = null;
        resetScan();
        st.has = false;
        document.body.classList.add( 'rec' );
        try { if ( st.mode === 'gyro' ) requestMotion( attachMotion ); } catch ( e ) {}
        try { lockCamera(); } catch ( e ) {}
        meta( 'REC' );
        vfcSeen = false;
        vfcTick = true;
        if ( video.requestVideoFrameCallback ) {
            try { video.requestVideoFrameCallback( onVFC ); } catch ( e ) {}
        }
        nextFrame();
    }

    function stop() {
        st.rec = false;
        document.body.classList.remove( 'rec' );
        unlockCamera();
        if ( st.has && st.len ) {
            crop();
            document.body.classList.add( 'has-scan' );
        }
        meta( 'DONE' );
    }

    function crop() {
        var v = isVertical(),
            copy = document.createElement( 'canvas' );
        copy.width = v ? st.len : BAND;
        copy.height = v ? BAND : st.len;
        copy.getContext( '2d' ).drawImage( scan, 0, 0 );
        scan.width = copy.width;
        scan.height = copy.height;
        ctx.drawImage( copy, 0, 0 );
    }

    function exportCanvas() {
        var out = document.createElement( 'canvas' ),
            g = null;
        out.width = scan.width;
        out.height = scan.height;
        g = out.getContext( '2d' );
        if ( st.dir === 'rl' ) { g.scale( -1, 1 ); g.drawImage( scan, -scan.width, 0 ); }
        else if ( st.dir === 'bt' ) { g.scale( 1, -1 ); g.drawImage( scan, 0, -scan.height ); }
        else g.drawImage( scan, 0, 0 );
        return out;
    }

    function downloadBlob( blob, name ) {
        var a = document.createElement( 'a' ),
            url = URL.createObjectURL( blob );
        a.download = name;
        a.href = url;
        document.body.appendChild( a );
        a.click();
        a.remove();
        setTimeout( function() { URL.revokeObjectURL( url ); }, 10000 );
    }

    function savePng() {
        var name = 'scanr-' + Date.now() + '.png';
        exportCanvas().toBlob( function( blob ) {
            var file = new File( [ blob ], name, { type: 'image/png' } );
            if ( navigator.canShare && navigator.canShare( { files: [ file ] } ) ) {
                navigator.share( { files: [ file ] } ).catch( function( err ) {
                    if ( err.name !== 'AbortError' ) downloadBlob( blob, name );
                } );
            } else {
                downloadBlob( blob, name );
            }
        }, 'image/png' );
    }

    var viewer = document.getElementById( 'viewer' ),
        vz = { el: null, s: 1, tx: 0, ty: 0, min: 1, max: 10, ptrs: new Map(), dist: 0, mid: null };

    function vzApply() {
        vz.el.style.transform = 'translate(' + vz.tx + 'px,' + vz.ty + 'px) scale(' + vz.s + ')';
    }

    function openViewer() {
        if ( !st.has || st.rec ) return;
        if ( vz.el ) vz.el.remove();
        vz.el = exportCanvas();
        viewer.appendChild( vz.el );
        var fit = Math.min( innerWidth / vz.el.width, innerHeight / vz.el.height );
        vz.s = fit;
        vz.min = fit * 0.5;
        vz.max = Math.max( 10, fit * 4 );
        vz.tx = ( innerWidth - vz.el.width * fit ) / 2;
        vz.ty = ( innerHeight - vz.el.height * fit ) / 2;
        vz.ptrs.clear();
        vzApply();
        viewer.hidden = false;
    }

    function closeViewer() {
        viewer.hidden = true;
        vz.ptrs.clear();
    }

    function vzPinchBase() {
        var p = Array.from( vz.ptrs.values() );
        vz.dist = Math.hypot( p[ 1 ].x - p[ 0 ].x, p[ 1 ].y - p[ 0 ].y );
        vz.mid = { x: ( p[ 0 ].x + p[ 1 ].x ) / 2, y: ( p[ 0 ].y + p[ 1 ].y ) / 2 };
    }

    viewer.addEventListener( 'pointerdown', function( e ) {
        if ( e.target.closest( 'button' ) ) return;
        try { viewer.setPointerCapture( e.pointerId ); } catch ( err ) {}
        vz.ptrs.set( e.pointerId, { x: e.clientX, y: e.clientY } );
        if ( vz.ptrs.size === 2 ) vzPinchBase();
    } );

    viewer.addEventListener( 'pointermove', function( e ) {
        var p = vz.ptrs.get( e.pointerId ),
            all, dist, mid, ns;
        if ( !p ) return;
        if ( vz.ptrs.size === 1 ) {
            vz.tx += e.clientX - p.x;
            vz.ty += e.clientY - p.y;
        }
        p.x = e.clientX;
        p.y = e.clientY;
        if ( vz.ptrs.size === 2 ) {
            all = Array.from( vz.ptrs.values() );
            dist = Math.hypot( all[ 1 ].x - all[ 0 ].x, all[ 1 ].y - all[ 0 ].y );
            mid = { x: ( all[ 0 ].x + all[ 1 ].x ) / 2, y: ( all[ 0 ].y + all[ 1 ].y ) / 2 };
            if ( vz.dist ) {
                ns = Math.min( Math.max( vz.s * dist / vz.dist, vz.min ), vz.max );
                vz.tx = mid.x - ( mid.x - vz.tx ) * ( ns / vz.s );
                vz.ty = mid.y - ( mid.y - vz.ty ) * ( ns / vz.s );
                vz.s = ns;
                vz.tx += mid.x - vz.mid.x;
                vz.ty += mid.y - vz.mid.y;
            }
            vz.dist = dist;
            vz.mid = mid;
        }
        vzApply();
    } );

    function vzEnd( e ) {
        vz.ptrs.delete( e.pointerId );
        if ( vz.ptrs.size === 2 ) vzPinchBase();
        else vz.dist = 0;
    }

    viewer.addEventListener( 'pointerup', vzEnd );
    viewer.addEventListener( 'pointercancel', vzEnd );

    var lastMotion = 0,
        motionAttached = false;

    function onMotion( e ) {
        var now = performance.now(),
            dt = lastMotion ? ( now - lastMotion ) / 1000 : 0,
            r = e.rotationRate,
            rad;
        lastMotion = now;
        if ( !r || r.gamma === null || !dt ) return;
        if ( !st.motion ) {
            st.motion = true;
            document.body.classList.add( 'motion' );
        }
        rad = ( isVertical() ? r.gamma : r.beta ) * Math.PI / 180 * dt;
        st.sweep += rad;
        st.drift += Math.tan( rad ) * video.videoWidth;
        st.drift *= 0.92;
    }

    function attachMotion() {
        if ( motionAttached ) return;
        motionAttached = true;
        window.addEventListener( 'devicemotion', onMotion );
    }

    function requestMotion( fn ) {
        if ( typeof DeviceMotionEvent !== 'undefined' &&
             typeof DeviceMotionEvent.requestPermission === 'function' ) {
            DeviceMotionEvent.requestPermission().then( function( res ) {
                if ( res === 'granted' ) fn();
            } ).catch( function() {} );
        } else {
            fn();
        }
    }

    function enableStab() {
        requestMotion( function() {
            attachMotion();
            st.stab = true;
            document.body.classList.add( 'stab' );
            document.getElementById( 'stab' ).classList.add( 'on' );
        } );
    }

    var locked = [];

    function camTrack() {
        var s = video.srcObject;
        return s && s.getVideoTracks ? s.getVideoTracks()[ 0 ] : null;
    }

    function lockCamera() {
        var t = camTrack(),
            adv = [],
            caps, cur;
        locked = [];
        if ( !t || !t.getCapabilities ) return;
        caps = t.getCapabilities();
        cur = t.getSettings();
        if ( ( caps.exposureMode || [] ).indexOf( 'manual' ) > -1 && cur.exposureTime ) {
            adv.push( { exposureMode: 'manual', exposureTime: cur.exposureTime } );
            locked.push( 'exposureMode' );
        }
        if ( ( caps.whiteBalanceMode || [] ).indexOf( 'manual' ) > -1 && cur.colorTemperature ) {
            adv.push( { whiteBalanceMode: 'manual', colorTemperature: cur.colorTemperature } );
            locked.push( 'whiteBalanceMode' );
        }
        if ( ( caps.focusMode || [] ).indexOf( 'manual' ) > -1 && cur.focusDistance ) {
            adv.push( { focusMode: 'manual', focusDistance: cur.focusDistance } );
            locked.push( 'focusMode' );
        }
        if ( adv.length ) t.applyConstraints( { advanced: adv } ).catch( function() { locked = []; } );
    }

    function unlockCamera() {
        var t = camTrack(),
            adv = [];
        if ( !t || !locked.length ) return;
        locked.forEach( function( k ) {
            var o = {};
            o[ k ] = 'continuous';
            adv.push( o );
        } );
        locked = [];
        t.applyConstraints( { advanced: adv } ).catch( function() {} );
    }

    function seg( id, attr, fn ) {
        var el = document.getElementById( id );
        el.addEventListener( 'click', function( e ) {
            var b = e.target.closest( 'button' );
            if ( !b ) return;
            el.querySelectorAll( 'button' ).forEach( function( x ) { x.classList.remove( 'on' ); } );
            b.classList.add( 'on' );
            fn( b.dataset[ attr ] );
        } );
    }

    document.getElementById( 'zoom' ).addEventListener( 'input', function( e ) {
        setZoom( parseFloat( e.target.value ) );
    } );

    seg( 'dirSeg', 'dir', function( d ) {
        if ( st.rec ) stop();
        st.dir = d;
        sliceLine.className = 'slice-line ' + ( isVertical() ? 'v' : 'h' );
        resetScan();
        meta( 'READY' );
    } );

    seg( 'modeSeg', 'mode', function( m ) {
        st.mode = m;
        st.jitter = 0;
        prevGray = null;
        document.body.classList.toggle( 'mode-img', m === 'img' );
        if ( !st.motion ) document.body.classList.remove( 'motion' );
        if ( m === 'gyro' && st.rec ) requestMotion( attachMotion );
    } );

    seg( 'sliceSeg', 'slice', function( s ) {
        st.slice = parseInt( s, 10 );
        meta( st.rec ? 'REC' : 'READY' );
    } );

    document.getElementById( 'stab' ).addEventListener( 'click', function() {
        if ( st.stab ) {
            st.stab = false;
            st.drift = 0;
            document.body.classList.remove( 'stab' );
            this.classList.remove( 'on' );
        } else {
            enableStab();
        }
    } );

    document.getElementById( 'shutter' ).addEventListener( 'click', function() {
        st.rec ? stop() : start();
    } );

    document.getElementById( 'save' ).addEventListener( 'click', savePng );
    document.getElementById( 'viewerSave' ).addEventListener( 'click', savePng );
    document.getElementById( 'viewerClose' ).addEventListener( 'click', closeViewer );
    preview.addEventListener( 'click', openViewer );

    resetScan();
    startCamera();

} )();
</script>
</body>
</html>
