<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sound Watch — Puget Sound Whale Sightings</title>
    <meta name="description" content="Offline-capable map of recent whale sightings across the Salish Sea, from southern BC to Olympia. Data from the Acartia cooperative.">
    <meta property="og:title" content="Sound Watch">
    <meta property="og:description" content="Recent whale sightings across Puget Sound and the Salish Sea, on and offline.">
    <meta property="og:type" content="website">
    <meta property="og:image" content="og-image.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="og-image.png">
    <meta name="theme-color" content="#8ec9f5">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%238ec9f5'/%3E%3Cpath d='M7 21c4-9 10-13 18-13-2 3-3 5-3 8 0 2 1 4 3 5-3 1-6 0-8-2-2 3-6 4-10 2z' fill='%23123a5c'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="map" role="application" aria-label="Sighting map"></div>

    <div class="brand-card glass">
        <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
            <circle cx="16" cy="16" r="16" fill="#123a5c"/>
            <path d="M7 21c4-9 10-13 18-13-2 3-3 5-3 8 0 2 1 4 3 5-3 1-6 0-8-2-2 3-6 4-10 2z" fill="#bfe9ff"/>
        </svg>
        <div>
            <h1>Sound Watch</h1>
            <p class="status-line"><span id="net-dot" class="dot" title="Connection status"></span><span id="sync-label">Never synced</span><button id="sync-btn" type="button" title="Sync now" aria-label="Sync now"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 0 1 13.6-5.7M20 12a8 8 0 0 1-13.6 5.7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><path d="M17 3v4h-4M7 21v-4h4" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button></p>
        </div>
    </div>

    <nav class="icon-rail" aria-label="App controls">
        <button class="icon-btn glass" type="button" data-panel="filters" title="Filters" aria-label="Filters">
            <svg viewBox="0 0 24 24"><path d="M3 5h18l-7 8v5l-4 2v-7Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
        </button>
        <button class="icon-btn glass" type="button" data-panel="feed" title="Sightings list" aria-label="Sightings list">
            <svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="4" cy="6" r="1.4" fill="currentColor"/><circle cx="4" cy="12" r="1.4" fill="currentColor"/><circle cx="4" cy="18" r="1.4" fill="currentColor"/></svg>
        </button>
        <button id="timeline-btn" class="icon-btn glass" type="button" title="Timeline" aria-label="Timeline">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 7.5V12l3.2 2.4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button class="icon-btn glass" type="button" data-panel="settings" title="Settings" aria-label="Settings">
            <svg viewBox="0 0 24 24"><path d="M10.2 3.2h3.6l.5 2.2a6.9 6.9 0 0 1 1.7 1l2.1-.8 1.8 3.1-1.6 1.5a7 7 0 0 1 0 1.9l1.6 1.5-1.8 3.1-2.1-.8a6.9 6.9 0 0 1-1.7 1l-.5 2.2h-3.6l-.5-2.2a6.9 6.9 0 0 1-1.7-1l-2.1.8-1.8-3.1 1.6-1.5a7 7 0 0 1 0-1.9L3.6 8.7l1.8-3.1 2.1.8a6.9 6.9 0 0 1 1.7-1Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><circle cx="12" cy="12" r="2.8" fill="none" stroke="currentColor" stroke-width="2"/></svg>
        </button>
    </nav>

    <section class="panel-glass glass" data-panel="filters" hidden aria-label="Filters">
        <header><h2>Filters</h2><button class="close-btn" type="button" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button></header>
        <div id="species-chips" class="chips" role="group" aria-label="Filter by species"></div>
        <div class="filter-row">
            <button id="tracks-toggle" class="chip active" type="button" title="Connect ID'd sightings with direction of travel">Tracks</button>
            <button id="heat-toggle" class="chip" type="button" title="Show sighting density instead of dots">Heatmap</button>
            <select id="range" aria-label="Time range">
                <option value="today">Today</option>
                <option value="1">Last 24 hours</option>
                <option value="3">Last 3 days</option>
                <option value="7" selected>Last 7 days</option>
                <option value="30">Last 30 days</option>
                <option value="0">All cached</option>
            </select>
        </div>
    </section>

    <section class="panel-glass glass" data-panel="feed" hidden aria-label="Sightings">
        <header><h2>Sightings</h2><button class="close-btn" type="button" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button></header>
        <p id="count-line" class="count-line"></p>
        <ol id="feed" class="feed"></ol>
        <div id="empty" class="empty" hidden>
            <svg viewBox="0 0 120 60" aria-hidden="true">
                <path d="M10 45 C30 10 60 5 105 12 c-8 8-11 15-10 22 1 5 4 9 9 11-8 3-15 1-20-4-6 8-16 11-28 8-14-3-32-2-46 8z" fill="none" stroke="currentColor" stroke-width="2"/>
            </svg>
            <p>No sightings match. Widen the time range or sync while online.</p>
        </div>
    </section>

    <section class="panel-glass glass" data-panel="settings" hidden aria-label="Settings">
        <header><h2>Settings</h2><button class="close-btn" type="button" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button></header>
        <label>Nearby alerts
            <select id="alert-km">
                <option value="0">Off</option>
                <option value="5">Within 5 km</option>
                <option value="10">Within 10 km</option>
                <option value="25">Within 25 km</option>
            </select>
        </label>
        <label>Acartia API token (optional, enables trusted-only feed)
            <input id="token" type="password" autocomplete="off" placeholder="Paste token from acartia.io">
        </label>
        <p class="credits">Data: <a href="https://acartia.io" rel="noopener">Acartia cooperative</a>, incl. Orca Network and Whale Alert reports. Map © OpenStreetMap contributors.</p>
    </section>

    <div class="time-bar glass" hidden>
        <button id="play-btn" type="button" aria-label="Play timeline">
            <svg class="ic-play" viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5Z" fill="currentColor"/></svg>
            <svg class="ic-pause" viewBox="0 0 24 24"><path d="M7 5h3.5v14H7ZM13.5 5H17v14h-3.5Z" fill="currentColor"/></svg>
        </button>
        <input id="scrub" type="range" min="0" max="100" value="100" aria-label="Time playback">
        <span id="scrub-label">All sightings</span>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js" crossorigin=""></script>
    <script src="app.js"></script>
</body>
</html>
