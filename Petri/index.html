<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Petri</title>
    <meta name="description" content="Gray–Scott reaction-diffusion under a dark-field microscope — WebGPU, no build step.">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="experiments by Kevin">
    <meta property="og:title" content="Petri">
    <meta property="og:description" content="Gray–Scott reaction-diffusion under a dark-field microscope — draw on the culture to seed new growth. WebGPU via vgpu, no build step.">
    <meta property="og:url" content="https://kevin-freitas-wwt.github.io/experiments/Petri/">
    <meta property="og:image" content="https://kevin-freitas-wwt.github.io/experiments/Petri/thumb.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Petri">
    <meta name="twitter:description" content="Gray–Scott reaction-diffusion under a dark-field microscope — WebGPU, no build step.">
    <meta name="twitter:image" content="https://kevin-freitas-wwt.github.io/experiments/Petri/thumb.png">
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --amber: #e8a33d;
            --hairline: rgba( 154, 164, 171, 0.25 );
            --ink: #05070a;
            --text: #9aa4ab;
            --text-dim: #5c656c;
        }
        * { box-sizing: border-box; }
        html, body {
            height: 100%;
            margin: 0;
        }
        body {
            background: var( --ink );
            color: var( --text );
            font-family: "IBM Plex Mono", ui-monospace, monospace;
            font-size: 12px;
            overflow: hidden;
        }
        canvas {
            cursor: crosshair;
            display: block;
            height: 100%;
            left: 0;
            position: fixed;
            top: 0;
            touch-action: none;
            width: 100%;
        }
        header {
            left: 20px;
            letter-spacing: 0.08em;
            pointer-events: none;
            position: fixed;
            top: 18px;
        }
        header h1 {
            color: #d6dde2;
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 0.35em;
            margin: 0 0 4px;
        }
        header p {
            color: var( --text-dim );
            margin: 0;
            text-transform: lowercase;
        }
        .panel {
            align-items: center;
            background: rgba( 5, 7, 10, 0.82 );
            backdrop-filter: blur( 6px );
            border: 1px solid var( --hairline );
            bottom: 16px;
            display: flex;
            gap: 18px;
            left: 50%;
            padding: 10px 18px;
            position: fixed;
            transform: translateX( -50% );
        }
        .panel .group {
            align-items: center;
            display: flex;
            gap: 6px;
        }
        .panel .label {
            color: var( --text-dim );
            font-size: 10px;
            letter-spacing: 0.18em;
            margin-right: 4px;
            text-transform: uppercase;
        }
        .panel button {
            background: none;
            border: 1px solid transparent;
            color: var( --text );
            cursor: pointer;
            font: inherit;
            font-size: 11px;
            letter-spacing: 0.12em;
            padding: 4px 8px;
            text-transform: uppercase;
        }
        .panel button:hover { border-color: var( --hairline ); }
        .panel button[aria-pressed="true"] {
            border-color: var( --amber );
            color: var( --amber );
        }
        .divider {
            background: var( --hairline );
            height: 22px;
            width: 1px;
        }
        .readout {
            color: var( --text-dim );
            font-size: 10px;
            letter-spacing: 0.1em;
        }
        .readout b {
            color: var( --amber );
            font-weight: 400;
        }
        #fallback {
            background: var( --ink );
            display: grid;
            height: 100%;
            left: 0;
            place-items: center;
            position: fixed;
            text-align: center;
            top: 0;
            width: 100%;
            z-index: 5;
        }
        #fallback p { max-width: 42ch; }
        @media ( max-width: 720px ) {
            .panel { flex-wrap: wrap; gap: 10px; justify-content: center; max-width: calc( 100% - 24px ); }
            .readouts { display: none; }
        }
        #fallback.preview {
            background-blend-mode: multiply;
            background-image: url( "thumb.png" );
            background-position: center;
            background-size: cover;
        }
        #fallback .notice {
            backdrop-filter: blur( 4px );
            padding: 22px 28px;
        }
    </style>
</head>
<body>
    <canvas id="view"></canvas>
    <header>
        <h1>PETRI</h1>
        <p>gray–scott reaction-diffusion &mdash; draw on the culture to seed growth</p>
    </header>
    <div class="panel" id="panel" hidden>
        <div class="group" id="presets">
            <span class="label">Culture</span>
            <button data-f="0.0367" data-k="0.0649">Mitosis</button>
            <button data-f="0.0545" data-k="0.0620" aria-pressed="true">Coral</button>
            <button data-f="0.0780" data-k="0.0610">Worms</button>
            <button data-f="0.0300" data-k="0.0620">Solitons</button>
            <button data-f="0.0260" data-k="0.0510">Maze</button>
        </div>
        <div class="divider"></div>
        <div class="group">
            <button id="reseed">Reseed</button>
            <button id="pause">Pause</button>
        </div>
        <div class="divider"></div>
        <div class="group readouts">
            <span class="readout">F <b id="rF">0.0545</b></span>
            <span class="readout">K <b id="rK">0.0620</b></span>
            <span class="readout">GRID <b id="rGrid">&mdash;</b></span>
            <span class="readout">FPS <b id="rFps">&mdash;</b></span>
        </div>
    </div>
    <div id="fallback" hidden>
        <div class="notice" style="background: rgba( 5, 7, 10, 0.72 );">
            <p>This experiment needs WebGPU. Try a current Chrome, Edge, Firefox, or Safari.</p>
            <p id="fallbackDetail" style="font-size: 0.85em; opacity: 0.6;"></p>
        </div>
    </div>
    <script type="module">
        import { init, effect, frame, pingPong, sampler, surface } from "../vendor/vgpu.js?v=7";

        const SEED_WGSL = `
            struct Params { seed: f32, pad0: f32, pad1: f32, pad2: f32 }
            @group(0) @binding(0) var<uniform> params: Params;

            fn hash( p: vec2f ) -> f32 {
                let h = dot( p, vec2f( 127.1, 311.7 ) ) + params.seed * 17.13;
                return fract( sin( h ) * 43758.5453123 );
            }

            @fragment fn fs_main( @location(0) uv: vec2f ) -> @location(0) vec4f {
                let cell = floor( uv * 96.0 );
                let speck = step( 0.985, hash( cell ) );
                let centre = 1.0 - step( 0.02, distance( uv, vec2f( 0.5 ) ) );
                let b = max( speck, centre );
                return vec4f( 1.0, b, 0.0, 1.0 );
            }
        `;

        const SIM_WGSL = `
            struct Params {
                feed: f32,
                kill: f32,
                brush: f32,
                mouseDown: f32,
                mouse: vec2f,
                dt: f32,
                pad0: f32,
            }
            @group(0) @binding(0) var src: texture_2d<f32>;
            @group(0) @binding(1) var<uniform> params: Params;

            fn cell( p: vec2i, size: vec2i ) -> vec2f {
                let q = clamp( p, vec2i( 0 ), size - vec2i( 1 ) );
                return textureLoad( src, q, 0 ).rg;
            }

            @fragment fn fs_main( @location(0) uv: vec2f ) -> @location(0) vec4f {
                let size = vec2i( textureDimensions( src ) );
                let p = vec2i( uv * vec2f( size ) );
                let c = cell( p, size );
                var lap = -c;
                lap += 0.2 * cell( p + vec2i( 1, 0 ), size );
                lap += 0.2 * cell( p + vec2i( -1, 0 ), size );
                lap += 0.2 * cell( p + vec2i( 0, 1 ), size );
                lap += 0.2 * cell( p + vec2i( 0, -1 ), size );
                lap += 0.05 * cell( p + vec2i( 1, 1 ), size );
                lap += 0.05 * cell( p + vec2i( -1, 1 ), size );
                lap += 0.05 * cell( p + vec2i( 1, -1 ), size );
                lap += 0.05 * cell( p + vec2i( -1, -1 ), size );
                let abb = c.x * c.y * c.y;
                var a = c.x + ( lap.x - abb + params.feed * ( 1.0 - c.x ) ) * params.dt;
                var b = c.y + ( 0.5 * lap.y + abb - ( params.kill + params.feed ) * c.y ) * params.dt;
                if ( params.mouseDown > 0.5 ) {
                    let d = distance( vec2f( p ), params.mouse );
                    if ( d < params.brush ) { b = max( b, 0.9 ); }
                }
                return vec4f( clamp( a, 0.0, 1.0 ), clamp( b, 0.0, 1.0 ), 0.0, 1.0 );
            }
        `;

        const DISPLAY_WGSL = `
            @group(0) @binding(0) var src: texture_2d<f32>;
            @group(0) @binding(1) var samp: sampler;

            @fragment fn fs_main( @location(0) uv: vec2f ) -> @location(0) vec4f {
                let texel = 1.0 / vec2f( textureDimensions( src ) );
                let b = textureSampleLevel( src, samp, uv, 0.0 ).g;
                let bx = textureSampleLevel( src, samp, uv + vec2f( texel.x, 0.0 ), 0.0 ).g
                       - textureSampleLevel( src, samp, uv - vec2f( texel.x, 0.0 ), 0.0 ).g;
                let by = textureSampleLevel( src, samp, uv + vec2f( 0.0, texel.y ), 0.0 ).g
                       - textureSampleLevel( src, samp, uv - vec2f( 0.0, texel.y ), 0.0 ).g;
                let edge = clamp( length( vec2f( bx, by ) ) * 6.0, 0.0, 1.0 );
                let body = smoothstep( 0.12, 0.42, b );
                let membrane = vec3f( 0.91, 0.64, 0.24 ) * edge;
                let cytoplasm = vec3f( 0.72, 0.86, 0.90 ) * body * 0.85;
                let glow = vec3f( 0.10, 0.16, 0.19 ) * smoothstep( 0.02, 0.2, b );
                var col = glow + cytoplasm + membrane;
                let vignette = 1.0 - 0.55 * pow( distance( uv, vec2f( 0.5 ) ) * 1.35, 2.2 );
                col *= max( vignette, 0.0 );
                return vec4f( col, 1.0 );
            }
        `;

        const BUILD = "Petri build 7 (2026-08-28)";
        console.log( BUILD );
        let booted = false;
        window.addEventListener( "error", ( e ) => {
            if ( !booted ) { showFallback( "Uncaught: " + e.message + " [" + BUILD + "]" ); }
        } );
        window.addEventListener( "unhandledrejection", ( e ) => {
            if ( !booted ) { showFallback( "Unhandled rejection: " + ( e.reason && e.reason.message || e.reason ) + " [" + BUILD + "]" ); }
        } );

        const state = {
            brush: 14,
            down: 0,
            feed: 0.0545,
            kill: 0.0620,
            mouse: [ -999, -999 ],
            paused: false,
            stepsPerFrame: 14,
        };

        async function main() {
            if ( !navigator.gpu ) {
                showFallback( "navigator.gpu is undefined \u2014 WebGPU is not enabled in this browser." );
                return;
            }
            let gpu;
            try {
                gpu = await init();
                gpu.onError( ( err ) => {
                    if ( /lost|destroy/i.test( String( err ) ) ) {
                        showFallback( "The GPU device was lost \u2014 the renderer may be overloaded on this hardware. " + err );
                    }
                } );
            } catch ( err ) {
                showFallback( err && String( err ).indexOf( "null" ) !== -1
                    ? "This browser exposes WebGPU but returned no adapter \u2014 the OS or GPU is likely blocklisted (in Firefox, see about:support \u2192 Graphics). Showing the static preview."
                    : "WebGPU init failed: " + ( err && err.message ? err.message : err ) );
                return;
            }

            const canvas = document.getElementById( "view" );
            const canvasSurface = surface( gpu, canvas, { dpr: [ 1, 2 ] } );
            const linear = sampler( gpu, { magFilter: "linear", minFilter: "linear" } );

            const seed = effect( gpu, SEED_WGSL, { set: { params: { seed: Math.random() * 100 } } } );
            const sim = effect( gpu, SIM_WGSL );
            const display = effect( gpu, DISPLAY_WGSL );

            let pp = null;
            let gridSize = [ 0, 0 ];

            function rebuild( w, h ) {
                const scale = Math.min( 1, 1024 / Math.max( w, h ) ) * 0.5;
                gridSize = [ Math.max( 64, Math.round( w * scale ) ), Math.max( 64, Math.round( h * scale ) ) ];
                pp = pingPong( gpu, gridSize[ 0 ], gridSize[ 1 ], { format: "rgba16float" } );
                reseed();
                document.getElementById( "rGrid" ).textContent = gridSize[ 0 ] + "×" + gridSize[ 1 ];
            }

            function reseed() {
                seed.set( { params: { seed: Math.random() * 100 } } );
                seed.draw( pp.write );
                pp.swap();
            }

            rebuild( canvasSurface.size[ 0 ], canvasSurface.size[ 1 ] );
            canvasSurface.onResize( ( { width, height } ) => rebuild( width, height ) );

            canvas.addEventListener( "pointerdown", ( e ) => { state.down = 1; trackPointer( e ); } );
            canvas.addEventListener( "pointermove", trackPointer );
            window.addEventListener( "pointerup", () => { state.down = 0; } );

            function trackPointer( e ) {
                const r = canvas.getBoundingClientRect();
                state.mouse = [
                    ( e.clientX - r.left ) / r.width * gridSize[ 0 ],
                    ( e.clientY - r.top ) / r.height * gridSize[ 1 ],
                ];
            }

            wireUi( reseed );
            document.getElementById( "panel" ).hidden = false;

            let last = performance.now();
            let fpsAccum = 0;
            let fpsCount = 0;

            function tick( now ) {
                fpsAccum += 1000 / Math.max( now - last, 0.1 );
                fpsCount++;
                if ( fpsCount === 30 ) {
                    document.getElementById( "rFps" ).textContent = Math.round( fpsAccum / fpsCount );
                    fpsAccum = 0;
                    fpsCount = 0;
                }
                last = now;
                if ( !state.paused ) {
                    for ( let i = 0; i < state.stepsPerFrame; i++ ) {
                        sim.set( {
                            src: pp.read,
                            params: {
                                brush: state.brush,
                                dt: 1.0,
                                feed: state.feed,
                                kill: state.kill,
                                mouse: state.mouse,
                                mouseDown: state.down,
                                pad0: 0,
                            },
                        } );
                        sim.draw( pp.write );
                        pp.swap();
                    }
                }
                display.set( { src: pp.read, samp: linear } );
                frame( gpu, ( f ) => f.pass( canvasSurface, display ) );
                booted = true;
                requestAnimationFrame( tick );
            }
            requestAnimationFrame( tick );
        }

        function wireUi( reseed ) {
            const presets = document.querySelectorAll( "#presets button" );
            presets.forEach( ( btn ) => {
                btn.addEventListener( "click", () => {
                    presets.forEach( ( b ) => b.setAttribute( "aria-pressed", "false" ) );
                    btn.setAttribute( "aria-pressed", "true" );
                    state.feed = parseFloat( btn.dataset.f );
                    state.kill = parseFloat( btn.dataset.k );
                    document.getElementById( "rF" ).textContent = state.feed.toFixed( 4 );
                    document.getElementById( "rK" ).textContent = state.kill.toFixed( 4 );
                } );
            } );
            document.getElementById( "reseed" ).addEventListener( "click", reseed );
            const pause = document.getElementById( "pause" );
            pause.addEventListener( "click", () => {
                state.paused = !state.paused;
                pause.textContent = state.paused ? "Resume" : "Pause";
                pause.setAttribute( "aria-pressed", state.paused ? "true" : "false" );
            } );
        }

        function showFallback( detail ) {
            const fb = document.getElementById( "fallback" );
            fb.hidden = false;
            fb.classList.add( "preview" );
            document.getElementById( "fallbackDetail" ).textContent = detail || "";
        }

        main();
    </script>
</body>
</html>
